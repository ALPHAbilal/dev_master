<title>Learner-led search</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Source+Serif+4:wght@400;700&display=swap">
<style>
/* The learner searches; the agent stays beside them. Pages always open on their real site, in another tab
   or window. Four ways for the agent to stay beside the learner, each played as a simulation on a desktop:
   the cursor is the learner, the conversation is the agent. Light only, the goal book's palette.
   The stage is drawn at 1200 by 720 and scaled to fit. */
:root{
  --bg:#ffffff; --canvas:#f4f4f2; --hover:#ebeae6; --hover-2:#e3e1db; --line:#e3e1db; --guide:#d8d6cf; --bar:#e3e1db;
  --ink:#1e2024; --ink-2:#4a4d53; --ink-3:#7a7d84; --ink-4:#a8a6a0; --pale:#c3c1ba;
  --accent:#4f7290; --accent-ink:#385876; --accent-soft:rgba(79,114,144,.15); --on-accent:#ffffff; --mark:rgba(79,114,144,.22);
  --desk:#dfddd6; --chrome:#e8e6e0; --chrome-line:#d2cfc7; --select:#b3d4fc;
  --site-ink:#26282b; --site-ink-2:#55585e; --serp-link:#2b4ea2;
  --ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono","Cascadia Code","SF Mono",Consolas,monospace;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:21px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{flex:none}
.wrap{max-width:1480px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}

/* the switch */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.ttl{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-right:auto;min-width:0}
.ttl h1{margin:0;font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.ttl .sub{font-size:13px;color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:10px;background:var(--hover)}
.seg button{height:30px;padding:0 12px;border:0;border-radius:8px;background:none;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.ctl{display:flex;gap:6px}
.ghost{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;color:var(--ink-2);cursor:pointer}
.ghost:hover{background:var(--hover);color:var(--ink)}
.ghost.on{border-color:var(--accent);color:var(--accent-ink)}
.vdesc{margin:0;font-size:14px;line-height:21px;color:var(--ink-2);max-width:860px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.facts div{min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.facts dt{font-size:12px;line-height:16px;color:var(--ink-3)}
.facts dd{margin:2px 0 0;font-size:13.5px;line-height:19px;color:var(--ink)}
.beats{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.beats button{height:28px;padding:0 10px;border:0;border-radius:7px;background:none;font-size:13px;color:var(--ink-4);cursor:pointer}
.beats button:hover{color:var(--ink)}
.beats button.past{color:var(--ink-3)}
.beats button.on{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.beats .sep{color:var(--pale);font-size:12px}

/* the stage: a desktop with windows */
.stage-wrap{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--desk)}
.stage{position:absolute;left:0;top:0;width:1200px;height:720px;transform-origin:0 0}
.desk{position:absolute;inset:0}
.win{position:absolute;display:flex;flex-direction:column;border:1px solid var(--chrome-line);border-radius:10px;background:var(--bg);box-shadow:0 14px 34px rgba(30,32,36,.13),0 1px 3px rgba(30,32,36,.07);overflow:hidden}
.tabstrip{flex:none;display:flex;align-items:flex-end;gap:2px;height:38px;padding:0 8px;background:var(--chrome)}
.dots{display:flex;gap:6px;align-self:center;margin:0 10px 0 4px}
.dots i{width:10px;height:10px;border-radius:50%;background:#cbc8c0}
.tab{display:flex;align-items:center;gap:8px;width:220px;min-width:0;height:31px;padding:0 10px;border-radius:9px 9px 0 0;font-size:12.5px;line-height:16px;color:var(--ink-2)}
.tab.on{background:var(--bg);color:var(--ink)}
.tab .tt{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab .x{color:var(--ink-4);display:grid;place-items:center}
.newtab{width:28px;height:28px;margin:0 0 2px 2px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.toolbar{flex:none;display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.navbtns{display:flex;gap:10px;color:var(--ink-4)}
.omni{flex:1;display:flex;align-items:center;gap:8px;min-width:0;height:28px;padding:0 12px;border-radius:14px;background:#f0efeb;font-size:12.5px;color:var(--ink-3)}
.omni.focus{background:var(--bg);box-shadow:inset 0 0 0 2px var(--accent)}
.omni .u{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.omni .host{color:var(--ink)}
.omni .ph{color:var(--ink-4)}
.extbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.extbtn.on{background:var(--accent-soft)}
.wbody{flex:1;min-height:0;display:flex;position:relative}
.fav{flex:none;width:16px;height:16px;border-radius:4px;background:var(--hover-2);display:grid;place-items:center;font-size:9.5px;font-weight:700;line-height:1;color:var(--ink-2)}
.fav.g{background:var(--accent);color:var(--on-accent)}
.fav.s{background:none;color:var(--ink-3)}
.popbar{flex:none;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:var(--chrome)}
.popaddr{flex:1;display:flex;align-items:center;gap:6px;min-width:0;height:24px;padding:0 10px;border-radius:12px;background:#f0efeb;font-size:12px;color:var(--ink-2)}
.popaddr span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pipbar{flex:none;display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;background:var(--chrome);font-size:12px;color:var(--ink-2)}
.pipbar .t{flex:1;min-width:0}
.pipbar .pb{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3)}
.pipbody{flex:1;min-height:0;display:flex;flex-direction:column}

/* the app: the goal book */
.app{flex:1;display:grid;grid-template-columns:330px minmax(0,1fr);min-width:0;min-height:0;background:var(--bg)}
.a-chat{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.a-float{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--ink-4)}
.turns{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:18px 16px 12px;scrollbar-width:none}
.turns.compact{gap:12px;padding:12px 12px 8px}
.m{display:flex;flex-direction:column;gap:6px;min-width:0}
.m.learner{align-items:flex-end}
.bub{max-width:92%;padding:10px 14px;border-radius:12px;background:var(--hover);font-size:14px;line-height:20px;color:var(--ink);overflow-wrap:anywhere}
.compact .bub{padding:8px 12px;font-size:13.5px;line-height:19px}
.m-quote{max-width:92%;padding:2px 8px;border-radius:6px;background:var(--mark);font-size:12.5px;line-height:18px;color:var(--ink-2)}
.m.agent .say{font-size:14.5px;line-height:22px;color:var(--ink);overflow-wrap:anywhere}
.compact .m.agent .say{font-size:13.5px;line-height:20px}
.m .act{font-size:12.5px;line-height:17px;color:var(--ink-3)}
.m.check{flex-direction:row;align-items:flex-start;gap:6px;font-size:12.5px;line-height:18px;color:var(--ink-2)}
.m.check svg{margin-top:3px;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:7px;background:var(--hover);font-size:13px;color:var(--ink-2)}
.cmp{flex:none;display:flex;flex-direction:column;gap:6px;margin:6px 12px 12px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.cmp.focus{border-color:var(--pale)}
.cmp-quote{align-self:flex-start;max-width:100%;padding:2px 8px;border-radius:6px;background:var(--mark);font-size:12.5px;line-height:18px;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cmp-row{display:flex;align-items:center;gap:8px;min-height:30px}
.cmp-text{flex:1;min-width:0;font-size:14px;line-height:20px;color:var(--ink);overflow-wrap:anywhere}
.cmp-text .ph{color:var(--ink-4)}
.cmp-send{flex:none;width:30px;height:30px;border-radius:8px;background:var(--hover);color:var(--ink-4);display:grid;place-items:center}
.cmp-send.ready{background:var(--accent);color:var(--on-accent)}
.caret{display:inline-block;width:1.5px;height:15px;margin-left:1px;vertical-align:-3px;background:var(--ink)}
.a-book{display:grid;grid-template-rows:52px minmax(0,1fr);min-width:0;min-height:0}
.a-head{display:flex;align-items:center;gap:12px;min-width:0;padding:0 14px 0 24px;border-bottom:1px solid var(--line)}
.goal-title{flex:1;min-width:0;font-size:14.5px;line-height:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-search{flex:none;display:flex;align-items:center;gap:8px;width:300px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;color:var(--ink-4)}
.a-search.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.a-search .v{color:var(--ink)}
.a-view{min-height:0;overflow-y:auto;scrollbar-width:none}
.a-results{max-width:640px;padding:20px 30px 40px;display:flex;flex-direction:column;gap:20px}
.res-site{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;line-height:17px;color:var(--ink-2)}
.res-site .u{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:var(--mono);font-size:11.5px;color:var(--ink-4)}
.res-t{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-size:16px;line-height:22px;font-weight:500;color:var(--accent-ink)}
.res-t svg{color:var(--ink-4)}
.res-d{margin-top:2px;font-size:13.5px;line-height:20px;color:var(--ink-2)}
.a-lesson{max-width:640px;margin:0 auto;padding:30px 36px 60px}
.crumb{display:flex;gap:8px;font-size:13px;line-height:18px;font-weight:600;color:var(--accent)}
.crumb .k{font-weight:400;color:var(--ink-4)}
.a-lesson h1{margin:8px 0 18px;font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.025em}
.ph{display:flex;flex-direction:column;gap:10px;padding:6px 0}
.bar{display:block;height:8px;border-radius:5px;background:var(--bar)}
.blk-q{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--canvas)}
.blk-q.fresh{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.blk-q .qm{flex:none;font-family:Georgia,serif;font-size:28px;line-height:1;color:var(--ink-4)}
.blk-q .qt{font-size:16px;line-height:27px;color:var(--ink)}
.qsrc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:8px;font-size:12.5px;line-height:18px;color:var(--ink-3)}
.qsrc .d{font-family:var(--mono);color:var(--ink-4)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--bg);font-size:11.5px;font-weight:500;color:var(--accent-ink)}

/* the conversation, in a narrow window */
.comp{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.c-head{flex:none;display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 16px;border-bottom:1px solid var(--line)}
.c-back{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;background:var(--hover);font-size:12.5px;color:var(--ink-2)}
.c-search{flex:none;display:flex;align-items:center;gap:8px;height:34px;margin:10px 12px 4px;padding:0 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;color:var(--ink-4)}
.c-search.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.c-search .v{color:var(--ink)}
.c-results{flex:none;max-height:236px;overflow-y:auto;padding:2px 6px 8px;border-bottom:1px solid var(--line);scrollbar-width:none}
.c-res{display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 8px;border-radius:8px}
.c-res .sm{flex:1;min-width:0;display:flex;flex-direction:column}
.c-res .tt{font-size:13px;line-height:18px;color:var(--accent-ink);font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.c-res .dm{font-family:var(--mono);font-size:11px;line-height:14px;color:var(--ink-4)}
.c-res svg{color:var(--ink-4)}

/* the browser's side panel */
.sidepanel{flex:none;width:340px;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--bg)}
.sp-head{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.sp-head .sp{flex:1}
.sp-head .x{color:var(--ink-4);display:grid;place-items:center}
.sp-out{flex:none;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.sp-lbl{margin-bottom:4px;font-size:12px;line-height:16px;font-weight:600;color:var(--ink-3)}
.sp-o{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;line-height:18px;color:var(--pale)}
.sp-o .dot{flex:none;width:6px;height:6px;border-radius:50%;background:currentColor}
.sp-o.past{color:var(--ink-3)}
.sp-o.on{color:var(--ink);font-weight:600}

/* other websites */
.site{flex:1;min-width:0;min-height:0;overflow-y:auto;position:relative;background:#fff;font-family:var(--serif);color:var(--site-ink);scrollbar-width:none}
.site-top{display:flex;align-items:center;gap:22px;height:50px;padding:0 32px;border-bottom:1px solid #ececea;font-family:var(--ui);font-size:13px;color:var(--site-ink-2)}
.site-top .logo{width:22px;height:22px;border-radius:6px;background:#2d2f33}
.site-art{max-width:660px;margin:0 auto;padding:36px 32px 380px;font-size:17px;line-height:1.7}
.site-art h1{margin:0 0 18px;font-size:31px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.site-art h2{margin:36px 0 10px;font-size:22px;line-height:1.3;font-weight:700}
.site-art p{margin:0 0 14px}
.site-art ul{margin:0;padding-left:1.3em}
.site-art pre{margin:4px 0 16px;padding:14px 16px;border-radius:8px;background:#f5f5f3;font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#33363a;overflow-x:auto}
.site-art .pass{position:relative}
.site-art .sel{background:var(--select)}
.addbtn{position:absolute;right:0;top:-46px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:0;border-radius:9px;background:var(--accent);box-shadow:0 6px 18px rgba(30,32,36,.18);font-family:var(--ui);font-size:13px;font-weight:500;color:var(--on-accent)}
.ntp{flex:1;background:#fff}
.serp{flex:1;min-width:0;min-height:0;overflow-y:auto;background:#fff;font-family:Arial,Helvetica,sans-serif;scrollbar-width:none}
.serp-top{display:flex;align-items:center;height:68px;padding:0 28px;border-bottom:1px solid #ebebeb}
.serp-box{display:flex;align-items:center;gap:10px;width:470px;height:42px;padding:0 18px;border-radius:21px;box-shadow:0 1px 5px rgba(0,0,0,.16);font-size:15px;color:#24272b}
.serp-box svg{color:#8a8d91}
.serp-list{max-width:640px;padding:18px 28px 40px 44px;display:flex;flex-direction:column;gap:24px}
.sr-site{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;color:#24272b}
.sr-site .u{font-size:12px;color:#686c72}
.sr-t{display:inline-block;margin-top:4px;font-size:19px;line-height:25px;color:var(--serp-link)}
.sr-d{margin-top:2px;font-size:14px;line-height:21px;color:#53575d}

/* the learner's hand */
.cursor{position:absolute;left:0;top:0;z-index:50;pointer-events:none;transition-property:transform;transition-timing-function:cubic-bezier(.3,.7,.25,1)}
.cursor svg{display:block;transition:transform .12s}
.cursor.down svg{transform:scale(.84)}
.keys{position:absolute;left:0;top:0;z-index:51;display:flex;gap:4px;pointer-events:none}
.keys span{padding:3px 8px;border-radius:6px;background:var(--ink);font-family:var(--mono);font-size:12px;line-height:16px;color:#fff}
.dragghost{position:absolute;left:0;top:0;z-index:49;max-width:300px;padding:5px 10px;border-radius:8px;background:#fff;box-shadow:0 6px 18px rgba(30,32,36,.18);font-size:12.5px;line-height:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition-property:transform;transition-timing-function:cubic-bezier(.3,.7,.25,1)}

/* behind the screen */
.behind{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
.behind-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.behind-h b{font-size:14px;font-weight:600}
.behind-h span{font-size:13px;color:var(--ink-3)}
.log{max-height:280px;overflow-y:auto;padding:8px 0;font-family:var(--mono);font-size:12px;line-height:19px}
.log-row{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;padding:3px 16px}
.log-row .who{color:var(--ink-4)}
.log-row .tx{color:var(--ink-2);overflow-wrap:anywhere}
.log-row.call .tx{color:var(--ink)}
.log-row .out{display:block;color:var(--ink-3)}
.log-empty{padding:6px 16px;color:var(--ink-4)}

.in{animation:arrive .34s ease both}
@keyframes arrive{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none}}
@media (max-width:760px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .log-row{grid-template-columns:minmax(0,1fr);gap:0}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="ttl"><h1>Learner-led search</h1><span class="sub">Simulation · pages shortened</span></div>
    <nav class="seg" id="seg" aria-label="Variations"></nav>
    <div class="ctl">
      <button class="ghost" id="pause" type="button">Pause</button>
      <button class="ghost" id="speed" type="button" aria-pressed="false">2×</button>
      <button class="ghost" id="replay" type="button">Replay</button>
    </div>
  </header>
  <p class="vdesc" id="vdesc"></p>
  <dl class="facts" id="facts"></dl>
  <div class="beats" id="beats"></div>
  <div class="stage-wrap" id="swrap">
    <div class="stage" id="stage">
      <div class="desk" id="desk"></div>
      <div class="dragghost" id="ghost" hidden></div>
      <div class="keys" id="keys" hidden></div>
      <div class="cursor" id="cursor"><svg width="20" height="24" viewBox="0 0 20 24" aria-hidden="true"><path d="M2 2v17l4.5-4.2 3.1 6.8 3-1.3-3-6.7 6-.2z" fill="#fff" stroke="#1e2024" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
  <section class="behind">
    <div class="behind-h"><b>Behind the screen</b><span>what makes each step possible</span></div>
    <div class="log" id="log"></div>
  </section>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);

/* ─── the learner's hand ─── */
function placeCursor(x,y,dur){
  cur.style.transitionDuration=dur+"ms";cur.style.transform=`translate(${x-2}px,${y-2}px)`;
  if(dragging){ghost.style.transitionDuration=dur+"ms";ghost.style.transform=`translate(${x+16}px,${y+18}px)`}
  CX=x;CY=y;
}
function pt(el,at){
  const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
  const x=(r.left-s.left)/scale,y=(r.top-s.top)/scale,w=r.width/scale,h=r.height/scale;
  if(at==="left")return [x+8,y+h/2];
  if(at==="right")return [x+w-2,y+h/2];
  if(at==="mid")return [x+w*.55,y+h*.5];
  return [x+w/2,y+Math.min(h/2,40)];
}
function wait(ms,id){
  if(id!==run)return Promise.reject("stop");
  if(fast())return Promise.resolve();
  return new Promise((res,rej)=>{let left=ms/speed,last=performance.now();
    const tick=now=>{if(id!==run)return rej("stop");if(!paused)left-=now-last;last=now;left<=0?res():requestAnimationFrame(tick)};
    requestAnimationFrame(tick)});
}
function helpers(id){
  const w=ms=>wait(ms,id);
  async function move(sel,at){
    const el=desk.querySelector(sel);if(!el)return;
    const [x,y]=pt(el,at),ms=Math.min(950,260+Math.hypot(x-CX,y-CY)*.75);
    placeCursor(x,y,fast()?0:ms/speed);await w(ms);
  }
  async function click(){if(fast())return;cur.classList.add("down");await w(130);cur.classList.remove("down");await w(80)}
  async function type(set,text,ms){
    if(fast()){set(text);render();return}
    for(let k=1;k<=text.length;k++){set(text.slice(0,k));render();await w(ms||34)}
  }
  async function keys(label){
    if(fast())return;
    keysEl.innerHTML=label.split(" ").map(k=>`<span>${esc(k)}</span>`).join("");
    keysEl.style.transform=`translate(${CX+16}px,${CY+22}px)`;keysEl.hidden=false;await w(760);keysEl.hidden=true;
  }
  async function scrollTo(anchor){
    const box=$("sitebox");if(!box)return;
    const a=box.querySelector(`[data-anchor="${anchor}"]`);if(!a)return;
    const target=Math.max(0,Math.min(a.offsetTop-20,box.scrollHeight-box.clientHeight)),from=box.scrollTop;
    if(fast()){box.scrollTop=target;S.site.scroll=target;return}
    const dur=Math.min(1700,500+Math.abs(target-from)*1.1)/speed;
    await new Promise((res,rej)=>{const t0=performance.now();
      const step=now=>{if(id!==run)return rej("stop");const p=Math.min(1,(now-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
        box.scrollTop=from+(target-from)*e;S.site.scroll=box.scrollTop;p<1?requestAnimationFrame(step):res()};
      requestAnimationFrame(step)});
  }
  async function select(){
    const n=PASSAGE.split(" ").length;
    if(fast()){S.site.sel=n;render();return}
    await move('[data-w="0"]',"left");cur.classList.add("down");
    for(let k=1;k<=n;k++){S.site.sel=k;render();const el=desk.querySelector(`[data-w="${k-1}"]`);if(el){const [x,y]=pt(el,"right");placeCursor(x,y,60/speed)}await w(55)}
    cur.classList.remove("down");await w(300);
  }
  async function drag(sel){
    if(fast())return;
    ghost.textContent="“"+PASSAGE+"”";dragging=true;ghost.hidden=false;placeCursor(CX,CY,0);
    cur.classList.add("down");await w(220);await move(sel);
    cur.classList.remove("down");dragging=false;ghost.hidden=true;await w(150);
  }
  async function agent(text,extra){
    S.thinking=true;render();await w(700);
    S.thinking=false;S.chat.push(Object.assign({who:"agent",text},extra||{}));render();
    await w(500+text.length*18);
  }
  async function send(where,text){
    await move(`[data-composer="${where}"]`);await click();S.focus=where;render();
    await type(t=>{S.draft=t},text);await w(250);
    await move(`[data-send="${where}"]`);await click();
    S.chat.push({who:"learner",text,quote:S.quoteIn===where?PASSAGE:null});
    S.draft="";S.quoteIn=null;S.focus=null;render();await w(400);
  }
  return {w,move,click,type,keys,scrollTo,select,drag,agent,send};
}
function found(v){S.book=1;S.chat.push({who:"check",text:v===3?CHECK_ADD:CHECK_PASTE});if(v===0)S.view="page"}

/* ─── the run ─── */
async function script(id){
  const {w,move,click,type,keys,scrollTo,select,drag,agent,send}=helpers(id);
  const v=ui.v;

  /* Ask */
  beat(0);render();await w(700);
  await send("app",QUESTION);
  if(v===2)await agent(A.ask3,{chips:["Search side by side"],key:"side"});
  else if(v===3)await agent(A.ask4);
  else await agent(A.ask);

  /* Search */
  beat(1);
  if(v<=1){
    await move('[data-searchfield="app"]');await click();S.qFocus=true;render();
    await type(t=>{S.q=t},QUERY,60);await keys("Enter");
    S.qFocus=false;S.view="results";render();
  }else if(v===2){
    await move('[data-chip="side"]');await click();S.leftWin=true;
    log("browser",'window.open("/goal/side", "conversation", "popup,left=0,top=0,width=420,height=…")',"→ the conversation, in a narrow window on the left, opened by the learner's click");
    render();await w(600);
    await move('[data-searchfield="left"]');await click();S.qFocus=true;render();
    await type(t=>{S.q=t},QUERY,60);await keys("Enter");
    S.qFocus=false;render();
  }else{
    await move("[data-newtab]");await click();
    S.tabs.push({id:"search",title:"New Tab",icon:"search"});S.active="search";render();await w(350);
    await move("[data-ext]");await click();S.panel=true;
    log("extension","the extension's toolbar button opens the side panel: chrome.sidePanel","→ the same conversation, next to any page");
    render();await w(600);
    await move("[data-omni]","left");await click();S.omniFocus=true;render();
    await type(t=>{S.omni=t},QUERY,60);await keys("Enter");
    S.omniFocus=false;S.serpOn=true;S.tabs[S.tabs.length-1].title=QUERY+" - Search";render();
  }
  if(v<=2)log("Firecrawl",`firecrawl.search("${QUERY}", limit=6)`,"→ 6 results: url · title · description");
  else log("extension","a content script reads the search engine's results page","→ each result's title and link");
  render();
  for(let i=1;i<=RESULTS.length;i++){if(v===3)S.serp=i;else S.results=i;render();await w(170)}
  log("Claude","reads the results and points out where each one comes from");
  await agent(A.results);

  /* Open */
  beat(2);
  if(v===1){
    await agent(A.float,{chips:["Float the chat"],key:"float"});
    await move('[data-chip="float"]');await click();S.pip=true;
    log("browser","documentPictureInPicture.requestWindow({ width: 324, height: 392 })","→ the conversation floats above every tab; Chrome and Edge on a computer; opened by the learner's click");
    render();await w(700);
  }
  if(v<=1){
    await move('[data-result="1"] .res-t');await click();
    S.tabs.push({id:"site",title:SITE_TITLE,icon:"I"});S.active="site";
    log("browser",`<a href="https://${SITE_URL}" target="_blank">`,"→ the real page, in a new tab");
  }else if(v===2){
    await move('[data-result="1"]');await click();S.rightWin=true;
    log("browser",`window.open("https://${SITE_URL}", "page", "popup,left=428,top=0,width=…,height=…")`,"→ the real page, in a window to the right of the conversation");
  }else{
    await move('[data-sresult="1"] .sr-t');await click();
    S.tabs.push({id:"site",title:SITE_TITLE,icon:"I"});S.active="site";S.site.here="top";
    log("extension","a content script reads the page: its text and its headings","→ and which heading is on screen, as the learner scrolls");
  }
  render();await w(450);
  if(v<=2)log("Firecrawl",`firecrawl.scrape("https://${SITE_URL}", formats=["markdown"])`,"→ the agent has the page's text and headings, not where the learner is on it");
  if(v===1||v===2)await agent(A.parts);
  else render();

  /* Read */
  beat(3);
  await move("#sitebox","mid");await scrollTo("tp");
  if(v===3){S.site.here="tp";render()}
  await w(2100);

  /* Debate */
  beat(4);
  if(v===0){
    await move('[data-tab="app"]');await click();S.active="app";
    log("browser","visibilitychange: the learner is back on the app's tab","→ the agent's turn");render();await w(400);
    await agent(A.welcome);
    await send("app",A.claim1);
    log("Claude","knows the page's parts, not how far the learner read, so it points back to the page");
    await agent(A.counter1);
    await move('[data-tab="site"]');await click();S.active="site";render();await w(400);
  }else{
    await send(v===1?"pip":v===2?"left":"panel",A.claim);
    if(v===3)log("Claude","knows where the learner is: MCP Rug Pulls is still below");
    await agent(v===3?A.counter4:A.counter);
  }

  /* Found */
  beat(5);
  await move("#sitebox","mid");await scrollTo("rp");
  if(v===3){S.site.here="rp";render()}
  await w(1400);
  await select();
  if(v===3){
    S.site.addBtn=true;log("extension","selectionchange: Add to the book appears next to the selection");render();await w(450);
    await move("[data-addbtn]");await click();
    S.site.addBtn=false;S.site.sel=0;found(v);
    log("code","the passage comes straight from the page, with its address","→ a block in the book, with its source");
    render();await w(900);
    await send("panel",A.insight);
  }else{
    if(v===2){
      await drag('[data-composer="left"]');S.focus="left";S.quoteIn="left";S.site.sel=0;
      log("browser","drag from the page's window, drop in the conversation: text/plain","→ the passage, as text");
      render();await w(350);
    }else{
      await keys("Ctrl C");
      if(v===0){await move('[data-tab="app"]');await click();S.active="app";render();await w(300)}
      const where=v===0?"app":"pip";
      await move(`[data-composer="${where}"]`);await click();S.focus=where;render();
      await keys("Ctrl V");S.quoteIn=where;S.site.sel=0;
      log("browser",v===0?"copy on the page, paste in the app":"copy on the page, paste in the floating window","→ the passage, as text");
      render();await w(350);
    }
    await send(v===0?"app":v===1?"pip":"left",A.insight);
    found(v);
    log("code","finds the passage, word for word, in the page's text from Firecrawl ✓","→ a block in the book, with its source");
    render();await w(700);
  }
  await agent(A.exactly);

  /* Next */
  beat(6);
  log("Claude","suggests the next concept; the search stays the learner's");
  await agent(A.next,{chips:["Search prompt injection","Stay on this page"]});
  await w(800);
  if(v===1){await move("[data-pipback]");await click();S.pip=false;S.active="app";S.view="page";log("browser","back to the tab: the conversation returns into the app");render()}
  else if(v===2){await move("[data-leftback]");await click();S.leftWin=false;S.rightWin=false;S.view="page";log("browser","both windows close: back to the book");render()}
  else if(v===3){await move('[data-tab="app"]');await click();S.active="app";S.view="page";log("extension","on the app's own tab the panel steps aside: the conversation is already there");render()}
  await w(300);
  S.done=true;renderBeats();
}

/* ─── controls ─── */
function play(){
  const id=++run;reset();
  keysEl.hidden=true;ghost.hidden=true;dragging=false;cur.classList.remove("down");placeCursor(760,560,0);
  render();renderBeats();
  script(id).catch(e=>{if(e!=="stop")console.error(e)});
}
const swrap=$("swrap");
function fit(){const W=swrap.clientWidth;scale=Math.min(1,W/1200);stage.style.left=Math.max(0,(W-1200)/2)+"px";stage.style.transform=`scale(${scale})`;swrap.style.height=Math.round(720*scale)+"px"}
$("seg").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;ui.v=+b.dataset.v;renderTop();fastTo=-1;play()});
$("beats").addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(!b)return;fastTo=+b.dataset.b;play()});
$("replay").addEventListener("click",()=>{fastTo=-1;play()});
$("pause").addEventListener("click",e=>{paused=!paused;e.currentTarget.textContent=paused?"Play":"Pause";e.currentTarget.classList.toggle("on",paused)});
$("speed").addEventListener("click",e=>{speed=speed===1?2:1;e.currentTarget.classList.toggle("on",speed===2);e.currentTarget.setAttribute("aria-pressed",speed===2)});
window.addEventListener("resize",fit);
fit();renderTop();play();
})();
</script>
