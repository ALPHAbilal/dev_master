<title>Goal Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the conversation on the left; the goal's book on the right, laid out like a docs site:
   pages in a sidebar (the platform's sidebar style), the lesson in the middle, "On this page" on the right.
   A lesson is a list of blocks: heading, paragraph, term, table, diagram, code, quote, note, list, examples,
   resource, steps, exercise, check. The Sources switch, top right, shows each block's sources under it.
   Selecting text highlights it and adds it to the agent's context. Both sidebars resize by dragging their edge.
   Type follows modelcontextprotocol.io: Inter, 16px on 28px lines, 24px and 20px headings, 14px tables
   and code on 24px lines. The space for each block's sources is always kept, so the
   Sources switch only shows or hides them and nothing moves.
   Light only, the platform's palette. */
:root{
  --bg:#ffffff; --canvas:#f4f4f2; --hover:#ebeae6; --hover-2:#e3e1db; --line:#e3e1db; --guide:#d8d6cf; --bar:#e3e1db;
  --ink:#1e2024; --ink-2:#4a4d53; --ink-3:#7a7d84; --ink-4:#a8a6a0; --pale:#c3c1ba;
  --accent:#4f7290; --accent-soft:rgba(79,114,144,.15); --on-accent:#ffffff; --mark:rgba(79,114,144,.22);
  --ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono","Cascadia Code","SF Mono",Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:21px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{flex:none}
.page{display:flex;flex-direction:column;height:100%}
.frame{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:var(--chat-w,340px) minmax(0,1fr);overflow:hidden;background:var(--bg)}
.frame.dragging,.frame.dragging *{cursor:col-resize!important;user-select:none!important}
.col{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-col{border-right:1px solid var(--line)}
.col-head{flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 8px}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.row-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:0;border-radius:8px;background:none;font-size:14px;line-height:21px;color:var(--ink);cursor:pointer}
.row-btn:hover{background:var(--hover)}
.ic{width:20px;height:20px;flex:none;display:grid;place-items:center;color:var(--ink-3)}
.bar{display:inline-block;height:8px;border-radius:5px;background:var(--bar)}
/* a column's right edge: drag to resize */
.grip{position:absolute;top:0;right:-4px;bottom:0;z-index:6;width:8px;cursor:col-resize;touch-action:none}
.grip::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent}
.grip:hover::after,.frame.dragging .grip.active::after{background:var(--guide)}

/* the conversation */
.turns{display:flex;flex-direction:column;gap:18px;padding:20px 16px 16px}
.turn{display:flex;flex-direction:column;gap:8px}
.turn.learner{align-items:flex-end}
.say{font-size:15px;line-height:22px;color:var(--ink);overflow-wrap:anywhere}
.turn.learner .say{max-width:92%;padding:12px 16px;border-radius:12px;background:var(--hover);line-height:20px}
.quotes{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:92%}
.quote-chip{padding:2px 8px;border-radius:6px;background:var(--mark);font-size:13px;line-height:19px;color:var(--ink-2);overflow-wrap:anywhere}
.act{display:flex;align-items:center;gap:8px;font-size:13px;line-height:17px;color:var(--ink-3)}
.placed{display:flex;flex-wrap:wrap;gap:6px}
.placed button{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:28px;padding:3px 10px;border:0;border-radius:7px;background:var(--hover);font-size:13px;line-height:19px;color:var(--ink-2);text-align:left;cursor:pointer}
.placed button:hover{background:var(--hover-2);color:var(--ink)}
.placed .sep{color:var(--ink-4)}
.composer-wrap{flex:none;padding:8px 16px 16px}
.composer{display:flex;flex-direction:column;gap:6px;padding:8px 8px 8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.composer:focus-within{border-color:var(--pale)}
.ctx{display:flex;flex-wrap:wrap;gap:6px}
.ctx button{display:inline-flex;align-items:center;gap:4px;max-width:100%;height:22px;padding:0 4px 0 8px;border:0;border-radius:6px;background:var(--mark);font-size:13px;line-height:17px;color:var(--ink);cursor:pointer}
.ctx button span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.composer-row{display:flex;align-items:center;gap:8px;min-height:32px}
.composer input{flex:1;min-width:0;border:0;outline:0;background:none;padding:5.5px 0;font-size:15px;line-height:21px;color:var(--ink)}
.composer input::placeholder{color:var(--ink-4)}
.send{width:32px;height:32px;flex:none;border:0;border-radius:8px;background:var(--hover);color:var(--ink-4);display:grid;place-items:center;cursor:pointer}
.send.ready{background:var(--accent);color:var(--on-accent)}

/* the book */
.book-wrap{display:flex;min-width:0;min-height:0;container-type:inline-size}
.book{flex:1;display:grid;grid-template-columns:var(--pages-w,248px) minmax(0,1fr) 220px;grid-template-rows:48px minmax(0,1fr);min-width:0;min-height:0}
.pages{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas);border-right:1px solid var(--line)}
/* the pages sidebar, as in the reference: 14px on 24px lines, titles dark and semibold, 32px between groups,
   10px between a title and its pages, 36px rows; the text of titles and rows lines up 24px from the edge */
.goal{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;min-width:0;height:48px;padding:13px 24px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.goal-title{flex:none;font-size:15px;line-height:22px;font-weight:600;color:var(--ink)}
.goal-line{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px;line-height:20px;color:var(--ink-3)}
.wide-btn{flex:none;align-self:center;width:32px;height:32px;margin:-13px -12px 0 0;border:0;border-radius:8px;background:none;color:var(--ink-3);display:grid;place-items:center;cursor:pointer}
.wide-btn:hover{background:var(--hover);color:var(--ink)}
/* enlarged: the conversation folds away and the book takes the whole frame */
.frame.wide{grid-template-columns:0 minmax(0,1fr)}
.frame.wide .chat-col{visibility:hidden;border-right:0}
.pages .scroll{padding:0 12px 24px}
.side-label{display:flex;align-items:center;margin:32px 0 10px;padding:0 12px;font-size:14px;line-height:24px;font-weight:600;color:var(--ink)}
.side-label:first-child{margin-top:20px}
.nav-row{display:flex;align-items:center;width:100%;min-height:36px;margin:0 0 1px;padding:6px 12px;border:0;border-radius:12px;background:none;font-size:14px;line-height:24px;color:var(--ink-2);text-align:left;cursor:pointer}
.nav-row span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nav-row:hover{background:var(--hover);color:var(--ink)}
.nav-row.on{background:var(--accent-soft);color:#385876;font-weight:600}
.nav-row.fresh{background:var(--bg);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}

.lesson-wrap{min-width:0;min-height:0;overflow-y:auto;scrollbar-width:thin}
.lesson{--fs:16px;--lh:1.75;--gap:1;max-width:768px;margin:0 auto;padding:32px 40px 96px;font-size:var(--fs);line-height:var(--lh)}
.crumb{display:flex;align-items:center;gap:8px;font-size:.875em;line-height:1.43;font-weight:600;color:var(--accent)}
.crumb .k{font-weight:400;color:var(--ink-4)}
.title-row{position:relative;display:flex;align-items:flex-start;gap:8px;margin-top:.5em}
.title-row h1{flex:1;min-width:0;margin:0;font-size:2.25em;line-height:1.111;font-weight:600;letter-spacing:-.025em;color:var(--ink);text-wrap:balance}
.tools{flex:none;display:flex;gap:6px;margin-top:4px}
.toggle{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;line-height:20px;color:var(--ink-2);cursor:pointer}
.toggle:hover{background:var(--hover)}
.track{position:relative;width:26px;height:16px;border-radius:8px;background:var(--pale)}
.track::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--bg)}
.toggle.on .track{background:var(--accent)}
.toggle.on .track::after{left:12px}

/* blocks: 1.25em apart, as in the reference; headings set their own space */
.blk{margin-top:calc(1.25em * var(--gap));border-radius:16px}
.blk.fresh{margin-left:-16px;margin-right:-16px;padding:12px 16px 14px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.lesson h2{margin:calc(2.25rem * var(--gap)) 0 0;font-size:1.5em;line-height:1.333;font-weight:600;letter-spacing:-.01em;color:var(--ink);scroll-margin-top:16px}
.lesson h3{margin:calc(2rem * var(--gap)) 0 0;font-size:1.25em;line-height:1.4;font-weight:600;color:var(--ink);scroll-margin-top:16px}
.lesson :is(h2,h3) + .blk{margin-top:calc(.875em * var(--gap))}
.b-p{margin:0;color:var(--ink-2)}
.b-p code,.b-steps code{font-family:var(--mono);font-size:.875em;font-weight:500;padding:.125em .375em;border-radius:6px;background:var(--hover);color:var(--ink)}
.b-term{display:flex;flex-direction:column;gap:.25em;padding:1em 1.25em;border:1px solid var(--line);border-radius:16px}
.b-term .w{font-weight:600;color:var(--ink)}
.b-term .d{color:var(--ink-2)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875em;line-height:1.43}
th{padding:.5em .75em .5em 0;border-bottom:1px solid var(--line);text-align:left;font-weight:600;color:var(--ink);white-space:nowrap}
td{padding:.75em .75em .75em 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
td:first-child{font-weight:600;color:var(--ink)}
.blk.is-code{margin-bottom:calc(.75em * var(--gap))}
.code{border:1px solid var(--line);border-radius:16px;background:var(--bg);overflow:hidden}
.code-head{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px 0 16px;border-bottom:1px solid var(--line)}
.code-head .f{flex:1;min-width:0;font-size:.8125em;color:var(--ink-3)}
.code-head button{height:28px;padding:0 8px;border:0;border-radius:7px;background:none;font-size:12px;color:var(--ink-3);cursor:pointer}
.code-head button:hover{background:var(--hover);color:var(--ink)}
.code pre{margin:0;padding:1em 1.25em;overflow-x:auto;font-family:var(--mono);font-size:.875em;line-height:1.714;color:var(--ink)}
.dia{display:flex;flex-direction:column;gap:.75em;padding:1.25em;border:1px solid var(--line);border-radius:16px}
.dia-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,.8fr) minmax(0,1fr);align-items:center}
.dia-box{padding:.5em .75em;border:1px solid var(--guide);border-radius:10px;background:var(--bg);font-size:.875em;line-height:1.43;font-weight:500;color:var(--ink);text-align:center}
.dia-box.to{background:var(--canvas)}
.dia-link{position:relative;height:20px;text-align:center;font-size:12px;line-height:14px;color:var(--ink-3)}
.dia-link::before{content:"";position:absolute;left:0;right:6px;top:15px;border-top:1px solid var(--ink-4)}
.dia-link::after{content:"";position:absolute;right:1px;top:11.5px;border:4px solid transparent;border-left:6px solid var(--ink-4)}
.b-quote{display:flex;gap:.75em;padding:1em 1.25em;border-radius:16px;background:var(--canvas)}
.b-quote .qm{flex:none;font-size:1.75em;line-height:1;color:var(--ink-4);font-family:Georgia,serif}
.b-quote .qt{color:var(--ink-2)}
.b-quote .who{display:block;margin-top:.25em;font-size:.875em;color:var(--ink-3)}
.b-note{display:flex;gap:.75em;padding:1em 1.25em;border:1px solid var(--line);border-radius:16px;background:var(--canvas)}
.b-note .ni{flex:none;display:grid;place-items:center;height:1.714em;color:var(--ink-3)}
.b-note .tx{font-size:.875em;line-height:1.714;color:var(--ink-2)}
.b-note .tx b{font-weight:600;color:var(--ink)}
.b-list{margin:0;padding-left:1.5em;color:var(--ink-2)}
.b-list li{padding-left:.25em}
.b-list li+li{margin-top:.5em}
.b-list li::marker{color:var(--ink-4)}
.b-ex .h{font-weight:600;color:var(--ink)}
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:0 1em;margin-top:.5em;font-size:.875em;line-height:1.714}
.ex div{padding:.625em 0;border-top:1px solid var(--line);color:var(--ink-2)}
.ex .q{font-weight:600;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1em}
.card{display:flex;flex-direction:column;gap:.25em;padding:1.25em 1.5em;border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}
.card .ci{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5em;color:var(--ink-3)}
.card .ct{font-weight:600;color:var(--ink)}
.card .cd{font-size:.875em;line-height:1.714;color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--hover);font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.b-steps{position:relative;margin-left:.375em}
.b-steps .st{position:relative;padding:0 0 calc(1em * var(--gap)) 1.75em;color:var(--ink-2)}
.b-steps .st::before{content:"";position:absolute;left:-4px;top:calc(var(--lh) * .5em - 4px);width:9px;height:9px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--ink-4)}
.b-steps .st:not(:last-child)::after{content:"";position:absolute;left:0;top:calc(var(--lh) * .5em + 8px);bottom:4px;border-left:1px solid var(--guide)}
.b-steps .st:last-child{padding-bottom:0}
.b-exercise{display:flex;flex-direction:column;gap:.5em;padding:1.25em 1.5em;border:1px solid var(--line);border-radius:16px}
.b-exercise .top{display:flex;align-items:center;gap:8px}
.b-exercise .nm{flex:1;min-width:0;font-weight:600;color:var(--ink)}
.b-exercise .tx{color:var(--ink-2)}
.btn{align-self:flex-start;height:32px;margin-top:.25em;padding:0 12px;border:0;border-radius:8px;background:var(--accent);font-size:13px;font-weight:500;color:var(--on-accent);cursor:pointer}
.btn:hover{background:#456580}
.b-check{display:flex;align-items:flex-start;gap:.75em;padding:1em 1.25em;border:1px solid var(--line);border-radius:16px;color:var(--ink-2)}
.b-check .bx{flex:none;width:14px;height:14px;margin-top:calc(var(--lh) * .5em - 7px);border:1.5px solid var(--pale);border-radius:4px}
mark{background:var(--mark);color:var(--ink);border-radius:3px;padding:0 1px;cursor:pointer}
/* the sources under a block */
.src-off .bsrc{visibility:hidden}
.bsrc{display:flex;flex-wrap:wrap;gap:.25em 1em;margin-top:.625em;font-size:.75em;line-height:1.5;color:var(--ink-4)}
.bsrc span{display:inline-flex;gap:6px;min-width:0}
.bsrc .tt{color:var(--ink-3)}
.bsrc .d{font-family:var(--mono)}

.rail{min-height:0;overflow-y:auto;padding:34px 16px 24px 8px;scrollbar-width:thin}
.rail-label{display:flex;align-items:center;gap:8px;height:24px;margin-bottom:8px;font-size:14px;line-height:20px;font-weight:500;color:var(--ink)}
.otp{display:block;width:100%;padding:6px 0;border:0;background:none;font-size:14px;line-height:20px;color:var(--ink-3);text-align:left;cursor:pointer}
.otp:hover{color:var(--ink)}
.otp.l3{padding-left:16px}
.otp.on{color:var(--ink);font-weight:600}

@container (max-width:900px){ .book{grid-template-columns:var(--pages-w,220px) minmax(0,1fr)} .rail{display:none} .lesson{padding:24px 28px 80px} }
/* enlarged: pages, lesson and "On this page" sit together in the middle of the screen, as in the reference;
   the space left over goes equally to both sides, and the goal bar lines up with the pages */
@container (min-width:901px){
  .frame.wide .book{grid-template-columns:minmax(0,1fr) var(--pages-w,248px) minmax(0,848px) 256px minmax(0,1fr)}
  .frame.wide .pages{grid-column:2;background:var(--bg);border-right:0}
  .frame.wide .lesson-wrap{grid-column:3}
  .frame.wide .rail{grid-column:4}
  .frame.wide .goal{padding-left:max(24px,calc((100% - var(--pages-w,248px) - 848px - 256px) / 2 + 24px));padding-right:max(24px,calc((100% - var(--pages-w,248px) - 848px - 256px) / 2 + 12px))}
  .frame.wide .pages .grip{display:none}
}
@container (max-width:600px){ .book{grid-template-columns:minmax(0,1fr)} .pages{display:none} .lesson{padding:20px 16px 72px} .dia-row{grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr)} }
@media (max-width:900px){
  .frame{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,.9fr) minmax(0,1.4fr);min-height:860px}
  .chat-col{border-right:0;border-bottom:1px solid var(--line)}
  .chat-col .grip{display:none}
  .frame.wide{grid-template-columns:minmax(0,1fr);grid-template-rows:0 minmax(0,1fr)}
  .frame.wide .chat-col{border-bottom:0}
}
</style>

<div class="page">
  <div class="frame" id="frame"></div>
</div>

<script>
(function(){
"use strict";
const sv=(d,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={
  up:sv('<path d="M8 13V3.5M4 7.5l4-4 4 4"/>'),
  xs:sv('<path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/>',12),
  plus:sv('<path d="M8 3v10M3 8h10"/>'),
  search:sv('<circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.25 3.25"/>',13),
  read:sv('<path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9 1.75v3.5h3.5"/>',13),
  write:sv('<path d="M3 13h3l7-7-3-3-7 7z"/>',13),
  expand:sv('<path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9M2.5 6.5v-4h4M2.5 2.5 7 7M13.5 9.5v4h-4M13.5 13.5 9 9"/>'),
  shrink:sv('<path d="M13.5 6.5h-4v-4M9.5 6.5l4-4M2.5 9.5h4v4M6.5 9.5l-4 4M6.5 2.5v4h-4M6.5 6.5l-4-4M9.5 13.5v-4h4M9.5 9.5l4 4"/>'),
  lines:sv('<path d="M3 4h10M3 8h7M3 12h9"/>',14),
  warn:sv('<path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.25v.01"/>',14),
  info:sv('<circle cx="8" cy="8" r="5.75"/><path d="M8 7.5v3.5M8 5.25v.01"/>',14),
  video:sv('<rect x="2" y="3.5" width="12" height="9" rx="2"/><path d="M7 6.25v3.5L10 8z"/>',18),
  doc:sv('<path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9 1.75v3.5h3.5"/>',18)
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const M="modelcontextprotocol.io";
const SRC=[
  ["Introducing the Model Context Protocol","anthropic.com"],["What is the Model Context Protocol?",M],
  ["Architecture overview",M],["Server concepts",M],["Specification, revision 2025-06-18",M],
  ["Build an MCP server",M],["Connect local servers to Claude Desktop",M],["MCP Inspector","github.com"],
  ["Python SDK","github.com"],["JSON-RPC 2.0 Specification","jsonrpc.org"],["Language Server Protocol","microsoft.github.io"],
  ["Tool poisoning attacks","invariantlabs.ai"],["Hugging Face MCP Course","huggingface.co"],["Security best practices",M]
];
const KIND={understanding:"Understanding",practice:"Practice"};

/* every lesson is a list of blocks; this page shows every kind of block */
const PRIMS=[
  {t:"p",id:"p0",text:"A server offers what it can do through three building blocks. Your notes server will use all three.",src:[3]},
  {t:"term",id:"p1",term:"Primitive",def:"One kind of thing a server can offer to an AI app. MCP servers have three: tools, resources and prompts.",src:[3,4]},
  {t:"h2",id:"h-three",text:"The three building blocks"},
