<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutor — Focus Stack</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#171b1f;--surface:#1e2328;--surface-2:#23292e;--line:#353c42;--text:#f0eee6;--secondary:#c7c3b8;--muted:#898a83;--disabled:#61635f;--accent:#d8b24d;--gap:#c78958;--ui:"Segoe UI",Tahoma,sans-serif;--code:"Cascadia Code","JetBrains Mono",Consolas,monospace;color:var(--text);background:var(--bg);font:16px var(--ui)}
body{min-height:100vh;background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}button,summary{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:focus-visible,summary:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.page{width:min(760px,calc(100% - 28px));margin:30px auto 80px}.top{display:flex;align-items:center;gap:9px;padding:0 2px 20px;border-bottom:1px solid var(--line)}.top h1{font-size:14px;font-weight:600}.top .state{margin-left:auto;color:var(--muted);font:10px var(--code)}
.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:18px 2px 22px;color:var(--muted);font:11px var(--code)}.breadcrumb .current{color:var(--text)}.breadcrumb svg{color:var(--disabled)}
.block{padding:22px 0;border-top:1px solid var(--line)}.block:first-of-type{border-top:0}.eyebrow{margin-bottom:13px;color:var(--muted);font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.eyebrow.gap{color:var(--gap)}
.causal{position:relative;margin-left:4px;padding-left:28px}.causal::before{content:"";position:absolute;left:8px;top:9px;bottom:10px;width:1px;background:var(--line)}.cause{position:relative;padding:0 0 17px}.cause:last-child{padding-bottom:0}.cause-icon{position:absolute;left:-28px;top:1px;width:17px;height:17px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}.cause.gap .cause-icon{color:var(--gap)}.cause .kind{margin-bottom:3px;color:var(--muted);font:9px var(--code);text-transform:uppercase}.cause.gap .kind{color:var(--gap)}.cause p{color:var(--secondary);font-size:12.5px}.cause q{font-style:italic;color:var(--text)}.cause q::before{content:"“"}.cause q::after{content:"”"}
.focus{padding:24px 22px;margin:4px 0;background:var(--surface);border-left:2px solid var(--accent)}.focus-head{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start}.focus-icon{color:var(--accent);padding-top:2px}.focus h2{font:600 16px/1.4 var(--code)}.focus .title{margin-top:4px;color:var(--secondary);font-size:12.5px}.depth{color:var(--muted);font:9.5px var(--code);white-space:nowrap}.axes{display:grid;gap:9px;margin-top:20px;padding-top:17px;border-top:1px solid var(--line)}.axis{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:9px;align-items:center;color:var(--secondary);font-size:11.5px}.axis-dot{width:7px;height:7px;border-radius:50%;background:var(--disabled)}.axis.SOLID .axis-dot{background:var(--accent)}.axis.SHAKY .axis-dot{background:#9f894c}.axis.MISSING .axis-dot{background:var(--gap)}.axis .verdict{color:var(--muted);font:9.5px var(--code)}
.next{display:grid;grid-template-columns:20px minmax(0,1fr);gap:11px}.next-icon{color:var(--accent);padding-top:2px}.next h3{margin-bottom:6px;font-size:12.5px;font-weight:600}.next p{color:var(--secondary);font-size:12.5px}.return-target{display:flex;align-items:flex-start;gap:10px;color:var(--secondary);font-size:12px}.return-target svg{flex:0 0 auto;color:var(--muted);margin-top:2px}.return-target strong{font:600 11.5px var(--code);color:var(--text)}.return-target span{display:block;margin-top:3px;color:var(--muted)}
.fold{border-top:1px solid var(--line)}.fold>summary{list-style:none;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:48px;padding:5px 2px;cursor:pointer}.fold>summary::-webkit-details-marker{display:none}.fold>summary:hover{color:var(--text)}.fold .fold-icon{color:var(--muted);transition:transform 130ms ease}.fold[open] .fold-icon{transform:rotate(90deg)}.fold .fold-title{font-size:11.5px}.fold .fold-count{color:var(--muted);font:9.5px var(--code)}.fold-body{padding:2px 0 18px 26px}
.episode{border-left:1px solid var(--line)}.episode+.episode{margin-top:3px}.episode-row{width:100%;display:grid;grid-template-columns:18px minmax(0,1fr) auto 18px;gap:8px;align-items:center;min-height:38px;padding:4px 4px 4px 10px;text-align:left;color:var(--secondary)}.episode-row:hover{background:var(--surface)}.episode-state{color:#aa985b}.episode-name{font:600 11.5px var(--code)}.episode-meta{color:var(--muted);font-size:10px}.episode-toggle{color:var(--muted);transition:transform 130ms ease}.episode.open .episode-toggle{transform:rotate(90deg)}.episode-detail{display:none;margin:0 12px 14px 36px;padding:12px 14px;background:var(--surface);color:var(--secondary);font-size:11.5px}.episode.open .episode-detail{display:block}.episode-detail dl{display:grid;grid-template-columns:76px minmax(0,1fr);gap:7px 10px}.episode-detail dt{color:var(--muted);font:9px var(--code);text-transform:uppercase}.episode-detail dd{min-width:0}.nested{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted)}
.queue{display:grid;gap:2px}.queue-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:34px;padding:3px 8px;color:var(--muted);font-size:11.5px}.queue-row svg{color:var(--disabled)}.queue-row .name{font-family:var(--code)}.queue-row .qstate{font:9px var(--code);color:var(--disabled)}
@media(max-width:560px){.page{width:calc(100% - 18px);margin-top:14px}.focus{padding:20px 16px}.focus-head{grid-template-columns:20px minmax(0,1fr)}.depth{display:none}.episode-detail{margin-left:20px}.episode-detail dl{grid-template-columns:1fr}.episode-detail dt{margin-top:5px}}
</style>
</head>
<body>
<main class="page">
  <header class="top"><span id="topIcon"></span><h1>Learning journey</h1><span class="state">2 / 6 owned · revision 50</span></header>
  <nav class="breadcrumb" id="breadcrumb" aria-label="Current learning path"></nav>

  <section class="block" aria-labelledby="why-title">
    <div class="eyebrow gap" id="why-title">Why you are here</div>
    <div class="causal" id="causal"></div>
  </section>

  <section class="focus" id="focus" aria-labelledby="focus-title"></section>

  <section class="block" aria-labelledby="next-title">
    <div class="eyebrow" id="next-title">Next proof</div>
    <div class="next"><span class="next-icon" id="nextIcon"></span><div><h3>Predict the program behavior</h3><p id="nextText"></p></div></div>
  </section>

  <section class="block" aria-labelledby="after-title">
    <div class="eyebrow" id="after-title">After this</div>
    <div class="return-target"><span id="returnIcon"></span><div><strong id="returnName"></strong><span id="returnText"></span></div></div>
  </section>

  <details class="fold" id="historyFold">
    <summary><span class="fold-icon" id="historyChevron"></span><span class="fold-title">Journey history</span><span class="fold-count" id="historyCount"></span></summary>
    <div class="fold-body" id="history"></div>
  </details>
  <details class="fold">
    <summary><span class="fold-icon chevron"></span><span class="fold-title">Related, non-blocking</span><span class="fold-count" id="relatedCount"></span></summary>
    <div class="fold-body queue" id="related"></div>
  </details>
  <details class="fold">
    <summary><span class="fold-icon chevron"></span><span class="fold-title">Later in this file</span><span class="fold-count" id="laterCount"></span></summary>
    <div class="fold-body queue" id="later"></div>
  </details>
</main>
<script>
const AX={COMPREHEND:"What it does",MECHANISM:"How it works",RATIONALE:"Why designed so",JUDGMENT:"When to use",ROBUSTNESS:"What breaks",INTEGRATION:"How it connects",EVOLUTION:"How to improve"};
const DATA={file:"run_prompts.py",progress:"2 / 6 owned",current:{slug:"collision_semantics",title:"What 'collision' means for ids",state:"CURRENT",depth:1,axes:[["COMPREHEND","SHAKY"],["MECHANISM","MISSING"]],parent:"_pinned_qa_group",resume:"trace an input where a pinned id also appears unpinned",answer:"They are different dict objects, so both entries should remain.",gap:"Object identity does not decide whether two equal ids represent one logical question.",next:"If pinned and unpinned contain the same ID, what should the output length be?"},history:[
{slug:"load_prompts",meta:"owned · 3/3",entered:"Main file sequence",proved:"Traced the file-loading path",returned:"Continued to normalize_row"},
{slug:"normalize_row",meta:"owned · 3/3",entered:"Main file sequence",proved:"Handled the missing-key normalization case",returned:"Continued to _pinned_qa_group"},
{slug:"dict_identity",meta:"owned · 2/2",entered:"Object identity was confused with value equality",proved:"Equal dictionaries can have different identities",returned:"_pinned_qa_group",nested:"hashing_keys · owned · proved __hash__ then __eq__"}
],related:[{slug:"dedupe_across_groups",state:"queued"}],later:[{slug:"_dedupe_by_id",state:"queued"},{slug:"build_prompt_batch",state:"locked"},{slug:"run_prompts",state:"locked"}]};
function svg(p,s=16){return `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" aria-hidden="true">${p}</svg>`}
const I={focus:()=>svg('<circle cx="8" cy="8" r="5.6" stroke="currentColor"/><circle cx="8" cy="8" r="2.2" fill="currentColor"/>'),check:()=>svg('<circle cx="8" cy="8" r="5" stroke="currentColor"/><path d="m5.7 8 1.5 1.6 3.2-3.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>'),gap:()=>svg('<path d="m8 2.5 5.5 5.5L8 13.5 2.5 8z" stroke="currentColor" stroke-width="1.2"/>'),answer:()=>svg('<path d="M3 3h10v7H7l-3 2v-2H3z" stroke="currentColor" stroke-width="1.2"/>'),return:()=>svg('<path d="M12.5 4.5H7A3.5 3.5 0 0 0 3.5 8v3m0 0L1.5 9m2 2 2-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>'),chev:()=>svg('<path d="M6 4.5 10 8l-4 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>'),arrow:()=>svg('<path d="M3 8h9m-3-3 3 3-3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>',14),branch:()=>svg('<path d="M4 3v7.5A2.5 2.5 0 0 0 6.5 13H12M4 6h3.5A2.5 2.5 0 0 0 10 3.5V3" stroke="currentColor"/><circle cx="4" cy="2.5" r="1.2" fill="currentColor"/><circle cx="10" cy="2.5" r="1.2" fill="currentColor"/>'),clock:()=>svg('<circle cx="8" cy="8" r="5.5" stroke="currentColor"/><path d="M8 4.5V8l2.5 1.5" stroke="currentColor" stroke-linecap="round"/>')};
function cause(cls,icon,kind,text,quote=false){const d=document.createElement("div");d.className=`cause ${cls}`;d.innerHTML=`<span class="cause-icon">${icon}</span><div class="kind">${kind}</div><p>${quote?`<q>${text}</q>`:text}</p>`;return d}
function render(){const c=DATA.current;document.getElementById("topIcon").innerHTML=I.focus();document.querySelectorAll(".chevron").forEach(x=>x.innerHTML=I.chev());document.getElementById("historyChevron").innerHTML=I.chev();document.getElementById("nextIcon").innerHTML=I.focus();document.getElementById("returnIcon").innerHTML=I.return();
 const crumb=document.getElementById("breadcrumb");[DATA.file,c.parent,c.slug].forEach((x,i,a)=>{if(i)crumb.insertAdjacentHTML("beforeend",I.arrow());const s=document.createElement("span");s.textContent=x;if(i===a.length-1)s.className="current";crumb.appendChild(s)});
 const causal=document.getElementById("causal");causal.appendChild(cause("",I.return(),"Resumed parent question",c.resume,true));causal.appendChild(cause("",I.answer(),"Your answer",c.answer,true));causal.appendChild(cause("gap",I.gap(),"Gap detected",c.gap));
 document.getElementById("focus").innerHTML=`<div class="focus-head"><span class="focus-icon">${I.focus()}</span><div><h2 id="focus-title">${c.slug}</h2><div class="title">${c.title}</div></div><span class="depth">depth ${c.depth} · current</span></div><div class="axes">${c.axes.map(a=>`<div class="axis ${a[1]}"><span class="axis-dot"></span><span>${AX[a[0]]}</span><span class="verdict">${a[1].toLowerCase()}</span></div>`).join("")}</div>`;
 document.getElementById("nextText").textContent=c.next;document.getElementById("returnName").textContent=`Return to ${c.parent}`;document.getElementById("returnText").textContent=`Resume: “${c.resume}”`;
 document.getElementById("historyCount").textContent=`${DATA.history.length} completed`;const history=document.getElementById("history");DATA.history.forEach(h=>{const e=document.createElement("article");e.className="episode";e.innerHTML=`<button class="episode-row"><span class="episode-state">${I.check()}</span><span class="episode-name">${h.slug}</span><span class="episode-meta">${h.meta}</span><span class="episode-toggle">${I.chev()}</span></button><div class="episode-detail"><dl><dt>Entered because</dt><dd>${h.entered}</dd><dt>Proved</dt><dd>${h.proved}</dd><dt>Returned to</dt><dd>${h.returned}</dd></dl>${h.nested?`<div class="nested">Nested prerequisite: ${h.nested}</div>`:""}</div>`;e.querySelector("button").onclick=()=>{history.querySelectorAll(".episode.open").forEach(x=>{if(x!==e)x.classList.remove("open")});e.classList.toggle("open")};history.appendChild(e)});
 document.getElementById("relatedCount").textContent=String(DATA.related.length);document.getElementById("related").innerHTML=DATA.related.map(x=>`<div class="queue-row"><span>${I.branch()}</span><span class="name">${x.slug}</span><span class="qstate">${x.state}</span></div>`).join("");document.getElementById("laterCount").textContent=String(DATA.later.length);document.getElementById("later").innerHTML=DATA.later.map(x=>`<div class="queue-row"><span>${I.clock()}</span><span class="name">${x.slug}</span><span class="qstate">${x.state}</span></div>`).join("")}
render();
</script>
</body>
</html>
