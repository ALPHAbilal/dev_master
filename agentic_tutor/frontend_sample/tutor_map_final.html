<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tutor — map</title>
<style>
/* tutor.html tokens — borderless, gray + gold, minimal. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.12) transparent;}
body{-webkit-font-smoothing:antialiased;min-height:100vh;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:3px;}
:root{
  --bg-app:#20252a;--bg-surface:#2b3138;--bg-card:#333a42;--bg-elevated:#3f474f;
  --text-primary:#f4f1e6;--text-secondary:#c6c2b3;--text-muted:#8d8b7e;--text-disabled:#5e5d54;
  --accent:#d8b24d;--accent-dim:#a98f3c;--accent-soft:rgba(216,178,77,0.15);--gap:#cf8f5a;
  --font-ui:"Segoe UI",Tahoma,sans-serif;--font-code:"Cascadia Code","JetBrains Mono","Consolas",monospace;
  background:var(--bg-app);color:var(--text-primary);font-family:var(--font-ui);line-height:1.55;
}
.map{max-width:600px;margin:0 auto;padding:26px 24px 60px;}

/* unit header — just the name + tiny axis dots, no labels */
.uhead{margin-bottom:26px;}
.uhead .name{font-size:16px;font-weight:600;color:var(--text-primary);}
.uhead .sub{font-size:12.5px;color:var(--text-muted);margin-top:3px;}
.uhead .axes{display:flex;gap:7px;margin-top:13px;align-items:center;}
.uhead .ax{width:7px;height:7px;border-radius:50%;background:var(--text-disabled);}
.uhead .ax.done{background:var(--accent);}
.uhead .ax.doing{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.uhead .count{font-size:11px;color:var(--text-disabled);margin-left:5px;}

/* the thread */
.thread{position:relative;}
.step{position:relative;display:flex;gap:13px;padding:6px 0;}
.step .m{width:14px;flex-shrink:0;display:flex;justify-content:center;padding-top:5px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-disabled);}
.dot.proved{background:var(--accent);}
.dot.learned{background:var(--text-muted);}
.dot.gap{background:var(--gap);}
.dot.shaky{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);}
.dot.note{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-disabled);}
.dot.sealed{background:transparent;box-shadow:inset 0 0 0 2px var(--accent-dim);}
.dot.here{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.step .txt{font-size:13.5px;color:var(--text-secondary);padding-top:1px;}
.step.proved .txt,.step.here .txt{color:var(--text-primary);}
.step.gap .txt{color:#e0a56f;}
.step.note .txt,.step.sealed .txt{color:var(--text-muted);font-size:12.5px;}
.step .here-tag{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--bg-app);background:var(--accent);border-radius:3px;padding:2px 5px;margin-left:8px;vertical-align:2px;}

/* a dive: subtle indent with a faint gold guide, no box */
.dive{margin:6px 0 6px 27px;padding-left:18px;border-left:1.5px solid rgba(207,143,90,0.28);}
.dive .lead{font-size:12px;color:var(--gap);padding:2px 0 4px;}
.dive .lead b{color:var(--text-secondary);font-weight:600;}

/* the return — quiet but unmistakable */
.ret{display:flex;gap:11px;padding:8px 0 8px 27px;}
.ret .a{color:var(--accent);flex-shrink:0;padding-top:1px;}
.ret .body .to{font-size:13px;color:var(--text-secondary);}
.ret .body .to b{color:var(--text-primary);font-weight:600;}
.ret .body .q{font-size:12px;color:var(--text-muted);font-style:italic;margin-top:2px;}
</style>
</head>
<body>
<div class="map">
  <div class="uhead" id="uhead"></div>
  <div class="thread" id="thread"></div>
</div>
<script>
const AX={COMPREHEND:"What it does",MECHANISM:"How it works",RATIONALE:"Why it's built this way",JUDGMENT:"When to use it",ROBUSTNESS:"What can break",INTEGRATION:"How it connects",EVOLUTION:"How to improve it"};

const UNIT={ title:"Group pinned questions first", slug:"_pinned_qa_group",
  axes:[["COMPREHEND","done"],["MECHANISM","done"],["ROBUSTNESS","doing"]],
  story:[
    ["learned",0,"pinned items stay in the order they were given"],
    ["proved",0,"you can read pinned-first ordering"],
    ["proved",0,"the order survives because the two groups are joined"],
    ["note",0,"de-dupe across groups doesn't block you"],
    ["gap",0,"the same id can appear in both groups — nothing removes the duplicate"],
    ["dive",0,"Dict identity vs value"],
      ["learned",1,"is checks identity, == checks value"],
      ["gap",1,"you needed how dict keys are matched"],
      ["dive",1,"Why keys must hash"],
        ["learned",2,"membership checks the hash, then equality"],
        ["proved",2,"you named a key Python can't hash"],
        ["sealed",2,"owned"],
      ["return",1,"Dict identity vs value",null,"which do two equal dicts share — identity or value?"],
      ["proved",1,"two equal-looking dicts are still different objects"],
      ["sealed",1,"owned"],
    ["return",0,"Group pinned questions first","ROBUSTNESS","trace an input where a pinned id also appears unpinned"],
    ["dive",0,"What 'collision' means for ids"],
      ["learned",1,"two equal ids mean one real question, not two"],
      ["shaky",1,"still fuzzy on what the output length should be"],
      ["here",1,"answer what the output length should be"],
  ]};

const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

/* header */
const done=UNIT.axes.filter(a=>a[1]==="done").length;
document.getElementById("uhead").innerHTML=
  `<div class="name">${UNIT.title}</div>`+
  `<div class="sub">${UNIT.axes.map(a=>AX[a[0]]).join(" · ")}</div>`+
  `<div class="axes">${UNIT.axes.map(a=>`<span class="ax ${a[1]}"></span>`).join("")}<span class="count">${done}/${UNIT.axes.length}</span></div>`;

/* thread — nested by depth, no label words */
const thread=document.getElementById("thread");
const stack=[thread]; /* container per depth */
function container(depth,intoName){
  while(stack.length-1>depth)stack.pop();
  while(stack.length-1<depth){
    const d=el("div","dive");
    if(intoName)d.appendChild(el("div","lead",`↳ <b>${intoName}</b>`));
    stack[stack.length-1].appendChild(d);
    stack.push(d);
  }
  return stack[depth+ (0)] ? stack[Math.min(depth,stack.length-1)] : stack[stack.length-1];
}
UNIT.story.forEach(row=>{
  const [t,d,a,b,c]=row;
  if(t==="dive"){ /* open a new indented container carrying the dive name */
    while(stack.length-1>=d+1)stack.pop();
    const box=el("div","dive"); box.appendChild(el("div","lead",`↳ <b>${a}</b>`));
    stack[Math.min(d,stack.length-1)].appendChild(box);
    stack[d+1]=box; stack.length=d+2;
    return;
  }
  const host=stack[Math.min(d,stack.length-1)];
  if(t==="return"){
    while(stack.length-1>d)stack.pop();
    const r=el("div","ret");
    r.innerHTML=`<span class="a">↩</span><div class="body"><div class="to">back to <b>${a}</b>${b?` · ${AX[b]}`:""}</div>`+
      (c?`<div class="q">picking up: “${c}”</div>`:"")+`</div>`;
    stack[Math.min(d,stack.length-1)].appendChild(r);
    return;
  }
  const step=el("div","step "+t);
  const tag=t==="here"?`<span class="here-tag">here</span>`:"";
  step.innerHTML=`<span class="m"><span class="dot ${t}"></span></span><span class="txt">${a}${tag}</span>`;
  host.appendChild(step);
});
</script>
</body>
</html>
