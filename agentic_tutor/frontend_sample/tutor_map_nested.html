<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tutor — nested ladder</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.12) transparent;}
body{line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;}
::selection{background:rgba(216,178,77,0.30);color:#fff;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:3px;}
:root{
  --bg-deepest:#171b1f;--bg-app:#20252a;--bg-surface:#2b3138;--bg-card:#333a42;--bg-elevated:#3f474f;
  --text-primary:#f4f1e6;--text-secondary:#c6c2b3;--text-muted:#8d8b7e;--text-disabled:#5e5d54;
  --accent:#d8b24d;--accent-dim:#a98f3c;--accent-soft:rgba(216,178,77,0.12);
  --gap:#cf8f5a;--gap-dim:rgba(207,143,90,0.5);--line:rgba(255,255,255,0.10);
  --font-ui:"Segoe UI",Tahoma,sans-serif;--font-code:"Cascadia Code","JetBrains Mono","Consolas",monospace;
  --tf:130ms ease;
  background:var(--bg-deepest);color:var(--text-primary);font-family:var(--font-ui);
}
.wrap{max-width:760px;margin:0 auto;padding:26px 22px 90px;}
.hd{display:flex;align-items:baseline;gap:12px;padding:2px 6px 22px;}
.hd h1{font-size:16px;font-weight:600;}
.hd .sub{font-size:12px;color:var(--text-muted);}
.hd .rev{margin-left:auto;font-size:10.5px;color:var(--text-disabled);font-family:var(--font-code);}

/* section (file) */
.sec{margin-bottom:6px;}
.sec-row{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;cursor:pointer;transition:var(--tf);}
.sec-row:hover{background:var(--bg-surface);}
.sec-title{font-size:14.5px;font-weight:600;font-family:var(--font-code);}
.caret{color:var(--text-disabled);font-size:9px;width:10px;transition:transform 150ms;}
.sec.open>.sec-row .caret,.unit.open>.u-row .caret{transform:rotate(90deg);}
.sec-body{display:none;} .sec.open>.sec-body{display:block;}
.u-meta{margin-left:auto;display:flex;align-items:center;gap:9px;}
.axp{font-size:10.5px;color:var(--text-disabled);font-family:var(--font-code);}

/* the ladder spine / indentation rail */
.lvl{position:relative;margin-left:15px;padding-left:18px;}
.lvl::before{content:"";position:absolute;left:0;top:-4px;bottom:8px;width:1.5px;background:var(--line);}
/* a dive branch: the rail turns gold + dashed to signal we descended into a prerequisite */
.lvl.dive::before{background:repeating-linear-gradient(var(--gap-dim) 0 5px,transparent 5px 10px);}
/* a RETURNED dive: the rail is solid gold and its bottom curls back toward the parent */
.lvl.dive.returned::before{background:var(--accent-dim);bottom:26px;}
.lvl.dive.returned::after{content:"";position:absolute;left:0;bottom:14px;width:15px;height:16px;
  border-left:1.5px solid var(--accent-dim);border-bottom:1.5px solid var(--accent-dim);border-bottom-left-radius:12px;}

/* unit */
.unit{position:relative;}
.u-row{position:relative;display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;cursor:pointer;transition:var(--tf);}
.u-row:hover{background:var(--bg-surface);}
.unit.cur>.u-row{background:var(--accent-soft);}
.u-row::before{content:"";position:absolute;left:-18px;top:50%;width:16px;height:1.5px;background:var(--line);}
.lvl.dive>.unit>.u-row::before{background:var(--gap-dim);}
.lvl.dive.returned>.unit>.u-row::before{background:var(--accent-dim);}

.mk{width:11px;height:11px;border-radius:50%;flex-shrink:0;background:var(--bg-elevated);}
.mk.OWNED{background:var(--accent);}
.mk.CURRENT{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.mk.PARKED{background:transparent;box-shadow:inset 0 0 0 2px var(--accent-dim);}
.mk.PROGRESS{background:var(--accent-dim);}
.mk.QUEUED{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-disabled);}
.mk.LOCKED{background:var(--bg-card);}
.mk.sq{border-radius:3px;}
.u-title{font-size:13px;color:var(--text-secondary);}
.unit.cur>.u-row .u-title,.u-row:hover .u-title{color:var(--text-primary);}
.slug{font-family:var(--font-code);}
.here{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--bg-deepest);background:var(--accent);border-radius:3px;padding:2px 5px;}
.tag{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;padding:2px 6px;color:var(--text-muted);background:var(--bg-surface);}
.tag.dive{color:var(--gap);background:rgba(207,143,90,0.12);}
.tag.done{color:var(--accent);background:var(--accent-soft);}
.tag.park{color:var(--accent-dim);background:var(--accent-soft);}
.tag.sib{color:var(--text-muted);}
.depth{font-size:8.5px;color:var(--text-disabled);font-family:var(--font-code);}

/* the DIVE-IN caption (why we descended) */
.dive-in{display:flex;gap:7px;align-items:baseline;font-size:11px;color:var(--gap);padding:1px 0 5px 2px;}
.dive-in .arw{font-size:13px;line-height:1;color:var(--gap-dim);}
.dive-in .why{color:var(--text-muted);}

/* the RETURN caption (loop popped back to the parent, replaying its exact question) */
.ret{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--accent-dim);padding:3px 0 6px 2px;margin-left:-4px;}
.ret .arw{font-size:15px;line-height:1;color:var(--accent);}
.ret .lead{color:var(--accent-dim);font-weight:600;}
.ret q{color:var(--text-secondary);font-style:italic;}
.ret q::before{content:"“";} .ret q::after{content:"”";}

/* kids container */
.kids{display:none;} .unit.open>.kids{display:block;}

/* expanded detail: axes + timeline (kept light) */
.detail{display:none;padding:2px 0 8px 4px;} .unit.open>.detail{display:block;}
.axes{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px;}
.ax{font-size:10px;font-weight:600;padding:3px 9px;border-radius:9999px;background:var(--bg-surface);color:var(--text-disabled);display:inline-flex;align-items:center;gap:5px;}
.ax .dot{width:6px;height:6px;border-radius:50%;background:var(--text-disabled);}
.ax.SOLID{color:var(--accent);background:var(--accent-soft);} .ax.SOLID .dot{background:var(--accent);}
.ax.SHAKY{color:#c9a24b;box-shadow:inset 0 0 0 1px rgba(201,162,75,0.4);} .ax.SHAKY .dot{background:#c9a24b;}
.ax.MISSING{color:#b96a5a;box-shadow:inset 0 0 0 1px rgba(185,106,90,0.4);} .ax.MISSING .dot{background:#b96a5a;}
.ax .esc{font-family:var(--font-code);opacity:.7;font-size:9px;}
.tl{position:relative;padding-left:15px;}
.tl::before{content:"";position:absolute;left:3px;top:5px;bottom:6px;width:1.5px;background:var(--line);}
.ev{position:relative;padding:4px 0 4px 2px;display:flex;gap:9px;align-items:baseline;}
.ev::before{content:"";position:absolute;left:-12px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--text-disabled);box-shadow:0 0 0 3px var(--bg-app);}
.ev .k{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);min-width:52px;}
.ev .txt{font-size:12px;color:var(--text-secondary);}
.ev.proven::before{background:var(--accent);} .ev.proven .k{color:var(--accent);}
.ev.taught::before{background:var(--text-secondary);border-radius:2px;}
.ev.gap::before{background:var(--gap);} .ev.gap .k{color:var(--gap);}
.ev.test::before{box-shadow:0 0 0 3px var(--bg-app),inset 0 0 0 2px var(--text-muted);background:transparent;}
.ev.next{opacity:.6;} .ev.next::before{background:transparent;box-shadow:inset 0 0 0 2px var(--accent),0 0 0 3px var(--bg-app);}

/* seal */
.seal{display:flex;align-items:center;gap:9px;background:var(--accent-soft);border-radius:8px;padding:6px 11px;font-size:11px;color:var(--text-secondary);margin-top:6px;}
.seal b{color:var(--accent);} .seal .diff{margin-left:auto;font-family:var(--font-code);font-size:10px;}
.seal .can{color:var(--accent);} .seal .cant{color:var(--gap);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1>Learning ladder</h1><span class="sub">nested · dive in ↘ / return ↩ / here</span><span class="rev" id="rev"></span></div>
  <div id="ladder"></div>
</div>
<script>
const AX={COMPREHEND:"What it does",MECHANISM:"How it works",RATIONALE:"Why designed so",JUDGMENT:"When to use",ROBUSTNESS:"What breaks",INTEGRATION:"How it connects",EVOLUTION:"How to improve"};

/* Data mirrors JourneyReader. A child dive carries:
 *   tag:"dive", dive_reason      — why the loop descended (push_child)
 *   returned:{resume:"…"}        — the dive completed & popped back, replaying the parent's exact question
 * A parent can hold several children over time: earlier ones returned, the last one may be live. */
const FILES=[
{ name:"run_prompts.py", open:true, units:[
  { slug:"load_prompts", title:"Read the prompt file", state:"OWNED",
    axes:[["COMPREHEND","SOLID"],["MECHANISM","SOLID"],["ROBUSTNESS","SOLID"]],
    timeline:[{k:"Taught",kind:"taught",txt:"json.load returns raw rows"},{k:"Proven",kind:"proven",txt:"traced the load path"}],
    seal:{v:"OWNED",can:2,cant:0,note:"file I/O ownership"} },

  { slug:"normalize_row", title:"Coerce each row's shape", state:"OWNED",
    axes:[["COMPREHEND","SOLID"],["MECHANISM","SOLID"],["RATIONALE","SOLID"]],
    timeline:[{k:"Taught",kind:"taught",txt:"bool(r.get('pin')) defaults pins"},{k:"Tested",kind:"test",txt:"missing-key case"},{k:"Proven",kind:"proven",txt:"handled absent key"}],
    seal:{v:"OWNED",can:1,cant:0,note:"normalization"} },

  /* THE LIVE UNIT — one dive already returned, a second dive is live now */
  { slug:"_pinned_qa_group", title:"Group pinned questions first", state:"PROBED", parent_of_here:true,
    resume:"trace an input where a pinned id also appears unpinned",
    axes:[["COMPREHEND","SOLID"],["MECHANISM","SOLID"],["ROBUSTNESS","SHAKY",1]],
    timeline:[{k:"Taught",kind:"taught",txt:"pinned kept in passed order"},{k:"Proven",kind:"proven",txt:"read pinned-first ordering"},{k:"Gap",kind:"gap",txt:"ids collide across groups — no dedupe"}],
    siblings:[{slug:"dedupe_across_groups",title:"De-dupe ids across groups"}],
    children:[
      /* dive #1 — COMPLETED and RETURNED (with a deeper dive that also returned) */
      { slug:"dict_identity", title:"Dict identity vs value", state:"OWNED", tag:"dive",
        dive_reason:"missing prerequisite for the collision gap",
        returned:{resume:"trace an input where a pinned id also appears unpinned"},
        axes:[["COMPREHEND","SOLID"],["MECHANISM","SOLID"]],
        timeline:[{k:"Taught",kind:"taught",txt:"`is` vs `==`"},{k:"Proven",kind:"proven",txt:"equal dicts differ in identity"}],
        seal:{v:"OWNED",can:1,cant:0,note:"identity vs value"},
        children:[
          { slug:"hashing_keys", title:"Why keys must hash", state:"OWNED", tag:"dive",
            dive_reason:"needed before identity could be proven",
            returned:{resume:"which do two equal dicts share — identity or value?"},
            axes:[["COMPREHEND","SOLID"],["MECHANISM","SOLID"]],
            timeline:[{k:"Taught",kind:"taught",txt:"membership: __hash__ then __eq__"},{k:"Proven",kind:"proven",txt:"named an unhashable key"}],
            seal:{v:"OWNED",can:1,cant:0,note:"hashing"} },
        ] },
      /* dive #2 — LIVE now, opened after #1 returned */
      { slug:"collision_semantics", title:"What 'collision' means for ids", state:"CURRENT", tag:"dive",
        dive_reason:"the gap re-fired after identity was owned",
        axes:[["COMPREHEND","SHAKY",1],["MECHANISM","MISSING"]],
        timeline:[{k:"Taught",kind:"taught",txt:"two equal ids ⇒ one logical question"},{k:"Probe",kind:"probe",txt:"so what should the output length be?"},{k:"Next",kind:"next",txt:"awaiting your answer"}] },
    ] },

  { slug:"_dedupe_by_id", title:"Drop duplicate ids", state:"QUEUED",
    axes:[["COMPREHEND","UNGRADED"],["MECHANISM","UNGRADED"]], timeline:[] },
  { slug:"build_prompt_batch", title:"Assemble the batch", state:"LOCKED",
    axes:[["COMPREHEND","UNGRADED"],["INTEGRATION","UNGRADED"]], timeline:[] },
  { slug:"run_prompts", title:"Drive the whole run", state:"LOCKED",
    axes:[["COMPREHEND","UNGRADED"],["JUDGMENT","UNGRADED"]], timeline:[] },
]},
{ name:"schema_loader.py", open:false, units:[
  { slug:"read_schema", title:"Load the schema", state:"PARKED", tag:"park",
    axes:[["COMPREHEND","SOLID"],["MECHANISM","SOLID"],["ROBUSTNESS","SHAKY",1]], timeline:[] },
  { slug:"validate_row", title:"Validate one row", state:"QUEUED", axes:[["COMPREHEND","UNGRADED"]], timeline:[] },
]},
];

const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const solid=u=>u.axes.filter(a=>a[1]==="SOLID").length;
const mkCls=u=>({OWNED:"OWNED",CURRENT:"CURRENT",PARKED:"PARKED",LOCKED:"LOCKED",QUEUED:"QUEUED"}[u.state]||"PROGRESS");
const onPath=u=>u.state==="CURRENT"||u.parent_of_here;
const D=new WeakMap(); function tagDepth(u,d){D.set(u,d);(u.children||[]).forEach(c=>tagDepth(c,d+1));}
FILES.forEach(f=>f.units.forEach(u=>tagDepth(u,0)));

function renderUnit(u){
  const unit=el("div","unit"+(u.state==="CURRENT"?" cur":"")+(onPath(u)?" open":""));
  const hasKids=(u.children&&u.children.length)||(u.siblings&&u.siblings.length);
  const hasDetail=u.timeline.length||u.axes.length;

  const row=el("div","u-row");
  let t=`<span class="mk ${mkCls(u)}"></span><span class="u-title"><span class="slug">${u.slug}</span> — ${u.title}</span>`;
  if(u.state==="CURRENT")t+=`<span class="here">here</span>`;
  if(u.tag==="dive")t+=`<span class="tag ${u.returned?'done':'dive'}">${u.returned?'dive · done':'dive'}</span>`;
  if(u.tag==="park")t+=`<span class="tag park">parked</span>`;
  row.innerHTML=`<div style="display:flex;align-items:center;gap:9px;min-width:0">${t}</div>`+
    `<span class="u-meta">${D.get(u)?`<span class="depth">depth ${D.get(u)}</span>`:''}<span class="axp">${solid(u)}/${u.axes.length}</span>${(hasDetail||hasKids)?'<span class="caret">▶</span>':''}</span>`;
  unit.appendChild(row);

  /* why we dived (shown just under the dive's row) */
  if(u.dive_reason){const d=el("div","dive-in",`<span class="arw">↘</span><span>dive · <span class="why">${u.dive_reason}</span></span>`);unit.appendChild(d);}

  /* light detail: axes + timeline */
  const detail=el("div","detail");
  const axes=el("div","axes");
  u.axes.forEach(([name,v,sh])=>{const c=el("span","ax "+v);c.innerHTML=`<span class="dot"></span>${AX[name]||name}`+(v==="SHAKY"&&sh?` <span class="esc">${"·".repeat(sh)}${sh>=2?"→miss":""}</span>`:"");c.title=name+" · "+v;axes.appendChild(c);});
  detail.appendChild(axes);
  if(u.timeline.length){const tl=el("div","tl");u.timeline.forEach(x=>tl.appendChild(el("div","ev "+x.kind,`<span class="k">${x.k}</span><span class="txt">${x.txt}</span>`)));detail.appendChild(tl);}
  if(u.seal){const s=el("div","seal",`<span>Distilled &amp; <b>${u.seal.v}</b> — ${u.seal.note}</span><span class="diff"><span class="can">can +${u.seal.can}</span>${u.seal.cant?` · <span class="cant">cant −${u.seal.cant}</span>`:""}</span>`);detail.appendChild(s);}
  unit.appendChild(detail);

  /* children (dives) + queued siblings, indented */
  if(hasKids){
    const kids=el("div","kids");
    if(u.children)u.children.forEach(c=>{
      const lvl=el("div","lvl dive"+(c.returned?" returned":""));
      lvl.appendChild(renderUnit(c));
      /* THE RETURN: the loop popped back to this parent, replaying its exact question */
      if(c.returned){
        lvl.appendChild(el("div","ret",
          `<span class="arw">↩</span><span><span class="lead">returned to ${u.slug}</span> — resumed <q>${c.returned.resume}</q></span>`));
      }
      kids.appendChild(lvl);
    });
    if(u.siblings)u.siblings.forEach(s=>{
      const lvl=el("div","lvl");
      lvl.innerHTML=`<div class="unit"><div class="u-row">
        <div style="display:flex;align-items:center;gap:9px"><span class="mk QUEUED sq"></span>
        <span class="u-title"><span class="slug">${s.slug}</span> — ${s.title}</span>
        <span class="tag sib">sibling · non-blocking</span></div><span class="u-meta axp">queued</span></div></div>`;
      kids.appendChild(lvl);
    });
    unit.appendChild(kids);
  }

  row.addEventListener("click",()=>unit.classList.toggle("open"));
  return unit;
}

const ladder=document.getElementById("ladder");
FILES.forEach(f=>{
  const sec=el("div","sec"+(f.open?" open":""));
  const owned=f.units.filter(u=>u.state==="OWNED").length;
  sec.appendChild(el("div","sec-row",`<span class="caret">▶</span><span class="sec-title">${f.name}</span><span class="u-meta"><span class="axp">${owned}/${f.units.length} owned</span></span>`));
  const body=el("div","sec-body");const lvl=el("div","lvl");
  f.units.forEach(u=>lvl.appendChild(renderUnit(u)));
  body.appendChild(lvl);sec.appendChild(body);
  sec.querySelector(".sec-row").addEventListener("click",()=>sec.classList.toggle("open"));
  ladder.appendChild(sec);
});
document.getElementById("rev").textContent="projection_revision 47";
</script>
</body>
</html>
