<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tutor — ASCII / terminal</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#12151a;--term:#171b21;--bar:#232830;--line:#2b323b;
  --fg:#c8c8bd;--dim:#5e6570;--faint:#3c434d;
  --amber:#d8b24d;--amber-d:#a98f3c;--gap:#d08a55;--green:#8fbf87;--cyan:#7fb6c4;
  --code:"Cascadia Code","JetBrains Mono","SF Mono",Consolas,monospace;
  background:var(--bg);color:var(--fg);font-family:var(--code);
}
body{min-height:100vh;padding:26px 18px 80px;}
.head{max-width:860px;margin:0 auto 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.head h1{font-size:13px;font-weight:600;color:var(--fg);letter-spacing:.3px;}
.head .note{font-size:11px;color:var(--dim);}
.seg{margin-left:auto;display:inline-flex;gap:3px;background:var(--bar);border-radius:8px;padding:3px;}
.seg button{font:600 11px var(--code);color:var(--dim);padding:6px 12px;border-radius:5px;border:0;background:none;cursor:pointer;}
.seg button:hover{color:var(--fg);} .seg button.on{color:var(--bg);background:var(--amber);}
/* terminal window */
.term{max-width:860px;margin:0 auto;background:var(--term);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,0.45);}
.termbar{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--bar);border-bottom:1px solid var(--line);}
.dot{width:11px;height:11px;border-radius:50%;}
.dot.r{background:#e0605a;} .dot.y{background:#e0b34d;} .dot.g{background:#5db65d;}
.termbar .ttl{margin-left:8px;font-size:11px;color:var(--dim);}
.termbar .rev{margin-left:auto;font-size:10px;color:var(--faint);}
.screen{padding:18px 20px 22px;overflow-x:auto;}
pre{font:13px/1.65 var(--code);white-space:pre;color:var(--fg);}
.variant{display:none;} .variant.on{display:block;}
/* token colors */
.o{color:var(--amber);} .od{color:var(--amber-d);} .g{color:var(--gap);}
.dm{color:var(--dim);} .fa{color:var(--faint);} .gr{color:var(--green);} .cy{color:var(--cyan);}
.b{font-weight:700;}
.hl{background:rgba(216,178,77,0.14);}
.cursor{display:inline-block;width:8px;height:15px;background:var(--green);vertical-align:-2px;animation:bl 1s steps(1) infinite;}
@keyframes bl{50%{opacity:0;}}
.cap{max-width:860px;margin:12px auto 0;font-size:11px;color:var(--dim);line-height:1.6;}
.cap b{color:var(--fg);}
</style>
</head>
<body>
<div class="head">
  <h1>tutor // ascii</h1><span class="note">no components — just text</span>
  <div class="seg" id="seg">
    <button data-v="1" class="on">1 · tree</button>
    <button data-v="2">2 · live log</button>
    <button data-v="3">3 · TUI</button>
  </div>
</div>

<div class="term">
  <div class="termbar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="ttl" id="ttl">learner@tutor: ~/run_prompts.py</span>
    <span class="rev">rev 50 · 2/6 owned</span>
  </div>
  <div class="screen">
    <div class="variant on" id="v1"><pre id="p1"></pre></div>
    <div class="variant" id="v2"><pre id="p2"></pre></div>
    <div class="variant" id="v3"><pre id="p3"></pre></div>
  </div>
</div>
<div class="cap" id="cap"></div>

<script>
/* colorize plain ASCII in place (replacements never change visible length) */
function color(t){
  t=t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const R=[
    [/●/g,'<span class="o">●</span>'],
    [/✓/g,'<span class="o">✓</span>'],
    [/◉/g,'<span class="o b">◉</span>'],
    [/◐/g,'<span class="o">◐</span>'],
    [/○/g,'<span class="dm">○</span>'],
    [/⊘/g,'<span class="fa">⊘</span>'],
    [/⊙/g,'<span class="od">⊙</span>'],
    [/⊹/g,'<span class="o">⊹</span>'],
    [/[↘]/g,'<span class="g">↘</span>'],
    [/[↩]/g,'<span class="o">↩</span>'],
    [/▰/g,'<span class="o">▰</span>'],
    [/▱/g,'<span class="fa">▱</span>'],
    [/▉/g,'<span class="cursor"></span>'],
    [/\bHERE\b/g,'<span class="o b">HERE</span>'],
    [/\bhere\b/g,'<span class="o b">here</span>'],
    [/\bdive\b/g,'<span class="g">dive</span>'],
    [/\bsibling\b/g,'<span class="dm">sibling</span>'],
    [/\bowned\b/g,'<span class="od">owned</span>'],
    [/\bOWNED\b/g,'<span class="o">OWNED</span>'],
    [/\bparked\b/g,'<span class="od">parked</span>'],
    [/\b(queued|locked)\b/g,'<span class="dm">$1</span>'],
    [/\bSOLID\b/g,'<span class="o">SOLID</span>'],
    [/\bSHAKY\b/g,'<span class="od">SHAKY</span>'],
    [/\bMISSING\b/g,'<span class="g">MISSING</span>'],
    [/\b(correct-deep|misconception|different-prereq|sibling-hole|shaky)\b/g,'<span class="g">$1</span>'],
    [/(_[a-z_]+|dict_identity|hashing_keys|collision_semantics|load_prompts|normalize_row|build_prompt_batch|run_prompts|dedupe_across_groups)/g,'<span class="cy">$1</span>'],
    [/(_point_next_root_locked|present_teaching|present_question|route_grade|_push_child_locked|_advance_after_solid_locked|_queue_sibling_locked|_effective_verdict|resume_after_child|finish_owned_unit|commit_distill|driver\.advance)/g,'<span class="dm">$1</span>'],
    [/» awaiting your answer/g,'<span class="gr b">» awaiting your answer</span>'],
  ];
  R.forEach(([re,rep])=>t=t.replace(re,rep));
  return t;
}
const pad=(s,n)=>s+" ".repeat(Math.max(0,n-s.length));

/* ══ 1 · tree ══════════════════════════════════════════════════════════════ */
const TREE=[
"run_prompts.py                                    2/6 owned",
"│",
"├─ ● load_prompts           owned      3/3  ▰▰▰",
"├─ ● normalize_row          owned      3/3  ▰▰▰",
"├─ ◐ _pinned_qa_group       here       2/3  ▰▰▱      ◉ HERE",
"│  │",
"│  ├─ ✓ dict_identity       dive owned 2/2  ▰▰   ↩ returned",
"│  │  └─ ✓ hashing_keys     dive owned 2/2  ▰▰   ↩ returned",
"│  ├─ ◐ collision_semantics dive       0/2  ▱▱      ◉ HERE",
"│  └─ ○ dedupe_across_groups sibling   queued",
"│",
"├─ ○ _dedupe_by_id          queued     0/2  ▱▱▱",
"├─ ⊘ build_prompt_batch     locked",
"└─ ⊘ run_prompts            locked",
"",
"schema_loader.py                                  0/2 owned",
"├─ ⊙ read_schema            parked     2/3  ▰▰▱",
"└─ ○ validate_row           queued     0/2  ▱▱",
"",
"legend  ● owned   ◐ active   ○ queued   ⊘ locked   ⊙ parked   ↩ returned",
].join("\n");

/* ══ 2 · live log ══════════════════════════════════════════════════════════ */
function L(indent,cells){return " ".repeat(indent)+cells;}
const LOG=[
"$ tutor journey --live  run_prompts.py::_pinned_qa_group",
"──────────────────────────────────────────────────────────────────",
L(0,"point   _pinned_qa_group            _point_next_root_locked"),
L(0,"teach   COMPREHEND                  present_teaching"),
L(0,'probe   COMPREHEND    "what shape comes back?"'),
L(0,"grade   COMPREHEND    SOLID correct-deep        ✓"),
L(0,"grade   MECHANISM     SOLID correct-deep        ✓"),
L(0,"grade   ROBUSTNESS    sibling-hole              ○ queue sibling  _queue_sibling_locked"),
L(0,"grade   ROBUSTNESS    MISSING misconception     ↘ dive           _push_child_locked"),
L(1,"╭─ depth 1 · dict_identity ─────────────────────────────────────"),
L(1,"teach   COMPREHEND                  present_teaching"),
L(1,"grade   MECHANISM     MISSING different-prereq   ↘ dive"),
L(2,"╭─ depth 2 · hashing_keys ────────────────────────────────────"),
L(2,"grade   MECHANISM     SOLID correct-deep        ✓"),
L(2,"distill                             OWNED  can +1   commit_distill"),
L(2,"╰─ ↩ return → dict_identity          resume_after_child"),
L(1,"grade   MECHANISM     SOLID correct-deep        ✓"),
L(1,"distill                             OWNED  can +1   commit_distill"),
L(1,"╰─ ↩ return → _pinned_qa_group       resume_after_child"),
L(0,"grade   ROBUSTNESS    gap re-fired              ↘ dive           _push_child_locked"),
L(1,"╭─ depth 1 · collision_semantics ───────────────────────────────"),
L(1,"teach   COMPREHEND                  present_teaching"),
L(1,"grade   COMPREHEND    SHAKY shaky (1/2)          ~ narrower probe _effective_verdict"),
L(1,'probe   MECHANISM     "what should the output length be?"'),
L(1,""),
L(1,"» awaiting your answer ▉"),
].join("\n");

/* ══ 3 · TUI dashboard ═════════════════════════════════════════════════════ */
const TUI=[
"╭─ WHERE YOU ARE ─────────────────────────────────────────────╮",
"│  collision_semantics                     depth 1 · dive     │",
"│  What 'collision' means for ids                             │",
"│                                                             │",
"│  COMPREHEND  ▰▱ SHAKY      MECHANISM  ▱▱ MISSING            │",
"╰─────────────────────────────────────────────────────────────╯",
"",
"╭─ STACK (top = you) ───────────╮   ╭─ NEXT PROOF ──────────────╮",
"│  2 ↑ collision_semantics  ◉   │   │  Predict the output       │",
"│  1   _pinned_qa_group  paused │   │  length for two equal ids │",
"│  0   run_prompts.py           │   │  → grades MECHANISM       │",
"╰───────────────────────────────╯   ╰───────────────────────────╯",
"",
"╭─ WHY YOU ARE HERE ──────────────────────────────────────────╮",
"│  ● proved COMPREHEND, MECHANISM on _pinned_qa_group         │",
"│  ↘ gap: ids collide across groups  (misconception)         │",
"│  ↘ dived dict_identity → hashing_keys                      │",
"│  ↩ both returned OWNED · learner can +2                    │",
"│  ↘ gap re-fired → dived collision_semantics  ← HERE        │",
"╰─────────────────────────────────────────────────────────────╯",
"",
"╭─ AHEAD ─────────────────────────────────────────────────────╮",
"│  ○ dedupe_across_groups   sibling · non-blocking            │",
"│  ○ _dedupe_by_id          queued                           │",
"│  ⊘ build_prompt_batch     locked                           │",
"│  ⊘ run_prompts            locked                           │",
"╰─────────────────────────────────────────────────────────────╯",
].join("\n");

document.getElementById("p1").innerHTML=color(TREE);
document.getElementById("p2").innerHTML=color(LOG);
document.getElementById("p3").innerHTML=color(TUI);

const TTL={1:"learner@tutor: ~/run_prompts.py — tree",2:"learner@tutor: ~ — journey --live",3:"learner@tutor: ~ — dashboard"};
const CAP={
 1:"<b>1 · tree.</b> The recursive ladder as <code>tree</code> output. Dives nest with box-drawing; ↩ marks a returned dive; glyphs carry state. Densest overview, most familiar to a terminal user.",
 2:"<b>2 · live log.</b> The loop as stdout. Depth <b>indents</b> the stream; a dive opens a <code>╭─ depth n ─</code> rule and a return closes it with <code>╰─ ↩</code>. Method names on the right map each line to the engine. Ends at the live prompt.",
 3:"<b>3 · TUI.</b> An ncurses-style panel layout drawn only in box characters — WHERE YOU ARE / STACK / NEXT / WHY / AHEAD. No scrolling, no tree; a fixed at-a-glance cockpit.",
};
function show(v){
  document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));
  ["1","2","3"].forEach(k=>document.getElementById("v"+k).classList.toggle("on",k===v));
  document.getElementById("ttl").textContent=TTL[v];
  document.getElementById("cap").innerHTML=CAP[v];
}
document.getElementById("seg").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.v);});
show("1");
</script>
</body>
</html>
