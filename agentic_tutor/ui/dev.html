<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tutor · dev</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --sunk:#0a0d12; --rule:#2a313c;
    --ink:#d7dde6; --ink2:#8b95a3; --ink3:#5c6470;
    --ok:#4cc38a; --warn:#e5a54b; --bad:#e5615c; --acc:#6ca4f5;
    --mono:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 .82rem/1.55 var(--mono)}
  header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--rule);
         padding:.6rem 1.2rem;display:flex;gap:1.2rem;align-items:baseline;z-index:2}
  header b{color:var(--acc);letter-spacing:.06em}
  header .active{color:var(--warn)}
  header a{color:var(--ink2);margin-left:auto;text-decoration:none}
  main{max-width:76rem;margin:0 auto;padding:1rem 1.2rem 4rem}
  h2{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);
     margin:1.6rem 0 .5rem;border-bottom:1px solid var(--rule);padding-bottom:.3rem}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--rule)}
  th,td{padding:.3rem .55rem;text-align:left;border-bottom:1px solid var(--rule);
        vertical-align:top;font-size:.76rem}
  th{color:var(--ink3);font-weight:600;text-transform:uppercase;font-size:.66rem;letter-spacing:.07em}
  tr:last-child td{border-bottom:none}
  td.wrap{white-space:pre-wrap;word-break:break-word;max-width:28rem}
  .tag{display:inline-block;padding:.05rem .4rem;border-radius:4px;border:1px solid var(--rule);
       font-size:.68rem}
  .HIT,.OWNED,.BUILT,.OPEN,.proved{color:var(--ok);border-color:var(--ok)}
  .MISS,.LOCKED,.hold,.FAILED{color:var(--bad);border-color:var(--bad)}
  .READY,.shown,.PASSED{color:var(--warn);border-color:var(--warn)}
  details.turn{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
               margin-bottom:.5rem;overflow:hidden}
  details.turn>summary{cursor:pointer;padding:.5rem .8rem;list-style:none;
                       display:flex;gap:.9rem;color:var(--ink2)}
  details.turn>summary::-webkit-details-marker{display:none}
  details.turn>summary b{color:var(--ink)}
  details.turn[open]>summary{border-bottom:1px solid var(--rule)}
  .turnbody{padding:.7rem .9rem}
  .turnbody h3{margin:.7rem 0 .25rem;font-size:.68rem;letter-spacing:.08em;
               text-transform:uppercase;color:var(--ink3)}
  pre{background:var(--sunk);border:1px solid var(--rule);border-radius:6px;
      padding:.55rem .7rem;margin:.2rem 0;overflow-x:auto;white-space:pre-wrap;
      word-break:break-word;font-size:.74rem;line-height:1.55;color:var(--ink2)}
  .step{display:grid;grid-template-columns:4.4rem 4.6rem 1fr;gap:.6rem;
        padding:.25rem 0;border-bottom:1px dashed var(--rule)}
  .step:last-child{border-bottom:none}
  .step .k{color:var(--acc)} .step .at{color:var(--ink3)}
  .empty{color:var(--ink3);padding:.5rem .2rem}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media(max-width:60rem){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <b>TUTOR / DEV</b>
  <span id="hActive" class="active">…</span>
  <span id="hCounts" style="color:var(--ink3)"></span>
  <a href="/">learner page →</a>
</header>
<main id="main">loading…</main>
<script>
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tag = s => `<span class="tag ${esc(s)}">${esc(s)}</span>`;
let D=null, T=null;
const openTurns = new Set();   // keep folds across polls

async function load(){
  const [d,t] = await Promise.all([
    fetch('/api/dev').then(r=>r.json()),
    fetch('/api/trace').then(r=>r.json()),
  ]);
  D=d; T=t.turns||[];
  render();
}

function render(){
  document.getElementById('hActive').textContent =
    `${D.active.label} · ${D.active.status} — ${D.active.activity}`;
  document.getElementById('hCounts').textContent =
    `probes ${D.probes.length} · mappings ${D.mappings.length} · trace turns ${T.length}`;
  document.getElementById('main').innerHTML = [
    section('Agent turns — verbatim trace', trace()),
    section('Probes (evidence, newest first)', probes()),
    `<div class="cols">${
      section('Mappings (the library)', mappings())}${
      section('Vocabulary door', vocab())}</div>`,
    `<div class="cols">${
      section('Concepts', concepts())}${
      section('Spine', slices())}</div>`,
    `<div class="cols">${
      section('Gates', gates())}${
      section('Meta + autowake', meta())}</div>`,
    section('Published frontier (raw)', D.frontier
      ? `<pre>${esc(JSON.stringify(D.frontier,null,2))}</pre>`
      : `<div class="empty">none — M/PLAN owes a turn</div>`),
  ].join('');
  document.querySelectorAll('details.turn').forEach(el=>{
    el.addEventListener('toggle',()=>{
      el.open ? openTurns.add(el.dataset.k) : openTurns.delete(el.dataset.k);
    });
  });
}

const section = (h,b) => `<section><h2>${h}</h2>${b}</section>`;

function trace(){
  if(!T.length) return `<div class="empty">no agent turns yet this session</div>`;
  return T.map((t,i)=>{
    const k='t'+i, open=openTurns.has(k)?' open':'';
    const steps=(t.steps||[]).map(s=>`<div class="step">
      <span class="at">${esc(s.at)}</span><span class="k">${esc(s.kind)}</span>
      <span>${esc(s.text||s.tool)}${s.args?`<pre>${esc(s.args)}</pre>`:''}${
        s.output?`<pre>${esc(s.output)}</pre>`:''}</span></div>`).join('');
    return `<details class="turn" data-k="${k}"${open}><summary>
        <b>${esc(t.agent)}</b><span>${esc(t.model)}</span>
        <span>${esc((t.steps||[]).length)} steps</span>
        <span style="margin-left:auto">${esc(t.outcome||'running…')}</span></summary>
      <div class="turnbody">
        <h3>tools allowed</h3><pre>${esc((t.tools_allowed||[]).join(' · '))}</pre>
        <h3>system prompt — verbatim</h3><pre>${esc(t.system_prompt)}</pre>
        <h3>first message (= rendered context)</h3><pre>${esc(t.first_message)}</pre>
        <h3>context note</h3><pre>${esc(t.context_note)}</pre>
        <h3>timeline</h3>${steps||'<div class="empty">none</div>'}
      </div></details>`;
  }).join('');
}

const table = (heads, rows) => rows.length
  ? `<table><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.join('')}</table>`
  : `<div class="empty">none</div>`;

const probes = () => table(
  ['id','concept','kind','result','pushes','selfcorr','reveals','note'],
  D.probes.map(p=>`<tr><td>${p.id}</td><td>${esc(p.concept_slug)}</td><td>${esc(p.kind)}</td>
    <td>${tag(p.result)}</td><td>${p.pushes}</td><td>${p.self_corrected??''}</td>
    <td class="wrap">${esc(p.reveals)}</td><td class="wrap">${esc(p.note)}</td></tr>`));

const mappings = () => table(['concept','trigger → solution → why','provenance'],
  D.mappings.map(m=>`<tr><td>${esc(m.concept_slug)}</td>
    <td class="wrap"><b>${esc(m.trigger)}</b>\n${esc(m.solution)}\n<i>${esc(m.why)}</i></td>
    <td class="wrap">${esc(m.provenance)}</td></tr>`));

const vocab = () => table(['term','state'],
  D.vocab.map(v=>`<tr><td>${esc(v.term)}</td><td>${tag(v.state)}</td></tr>`));

const concepts = () => table(['slug','state'],
  D.concepts.map(c=>`<tr><td>${esc(c.slug)}</td><td>${tag(c.state)}</td></tr>`));

const slices = () => table(['#','slug','state','spec'],
  D.slices.map(s=>`<tr><td>${s.ordinal??'?'}</td><td>${esc(s.slug)}</td>
    <td>${tag(s.state)}</td><td>${s.spec_path?'✓':'∅'}</td></tr>`));

const gates = () => table(['slice','state'],
  D.gates.map(g=>`<tr><td>${esc(g.slice_slug)}</td><td>${tag(g.state)}</td></tr>`));

const meta = () => table(['key','value'],
  D.meta.map(m=>`<tr><td>${esc(m.key)}</td><td class="wrap">${esc(m.value)}</td></tr>`)
  .concat(D.autowake_tokens.map(t=>`<tr><td>autowake</td><td>${esc(t)}</td></tr>`)));

load().then(()=>setInterval(load,2000))
      .catch(e=>document.getElementById('main').textContent='dev page failed: '+e);
</script>
</body>
</html>
