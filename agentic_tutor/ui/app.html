<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tutor</title>
<style>
/* ============================================================
   Surveyor's field record.
   Prose is human speech -> sans. Identifiers are machine truth -> mono.
   Colour carries state and nothing else: blue = survey/plan, amber = live,
   red = the gate, green = earned. Everything else is ink on paper.
   ============================================================ */
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --sunk:#E4E8EF;
  --ink:#0F141C; --ink2:#454E5E; --ink3:#78839A;
  --rule:#CDD5E1; --rule2:#DFE5EE;
  --survey:#1F4FCC; --survey-bg:#E4EBFC;
  --live:#9A5B00;   --live-bg:#FBEEDC;
  --gate:#A8291A;   --gate-bg:#FBE6E2;
  --built:#0B6440;  --built-bg:#DFF2E8;
  --shadow:0 1px 2px rgba(15,20,28,.06), 0 4px 12px rgba(15,20,28,.05);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1017; --surface:#141B25; --sunk:#0A0E14;
    --ink:#EDF1F8; --ink2:#AAB6C8; --ink3:#717E93;
    --rule:#28323F; --rule2:#1E2732;
    --survey:#87ACFF; --survey-bg:#18233C;
    --live:#F5B458;   --live-bg:#32250F;
    --gate:#FF8E7A;   --gate-bg:#3A1B16;
    --built:#5BD8A2;  --built-bg:#0E2E22;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#0C1017; --surface:#141B25; --sunk:#0A0E14;
  --ink:#EDF1F8; --ink2:#AAB6C8; --ink3:#717E93;
  --rule:#28323F; --rule2:#1E2732;
  --survey:#87ACFF; --survey-bg:#18233C;
  --live:#F5B458;   --live-bg:#32250F;
  --gate:#FF8E7A;   --gate-bg:#3A1B16;
  --built:#5BD8A2;  --built-bg:#0E2E22;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
:focus-visible{outline:2px solid var(--survey); outline-offset:2px; border-radius:3px}
.mono{font-family:var(--mono)}
.wrap{max-width:1280px; margin:0 auto; padding:0 1.75rem 5rem}

/* ---------- masthead ---------- */
.top{
  display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
  padding:1.4rem 0 1.1rem; border-bottom:1px solid var(--rule);
}
.mark{
  font:600 1.02rem/1 var(--sans); letter-spacing:-.02em; margin:0;
  display:flex; align-items:center; gap:.55rem;
}
.mark::before{
  content:""; width:11px; height:11px; border:2.5px solid var(--survey);
  border-radius:50%; box-shadow:inset 0 0 0 2px var(--surface);
}
.target{
  font:400 .78rem/1.4 var(--mono); color:var(--ink3);
  flex:1; min-width:12rem; word-break:break-all;
}
.ghost{
  font:500 .74rem/1 var(--sans); color:var(--ink2); background:transparent;
  border:1px solid var(--rule); border-radius:6px; padding:.42rem .7rem; cursor:pointer;
}
.ghost:hover{background:var(--surface); color:var(--ink)}

/* ---------- status bar ---------- */
.status{
  display:flex; align-items:center; gap:.85rem; flex-wrap:wrap;
  padding:.85rem 1rem; margin:1.1rem 0 1.6rem;
  background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  box-shadow:var(--shadow);
}
.chip{
  display:inline-flex; align-items:center; gap:.5rem; flex-shrink:0;
  font:600 .76rem/1 var(--mono); letter-spacing:.02em;
  padding:.4rem .65rem; border-radius:6px; border:1px solid transparent;
}
.chip .led{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.chip.running{color:var(--live); background:var(--live-bg); border-color:currentColor}
.chip.running .led{animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.chip.due{color:var(--survey); background:var(--survey-bg); border-color:currentColor}
.chip.due .led{background:transparent; box-shadow:inset 0 0 0 1.5px currentColor}
.chip.waiting{color:var(--built); background:var(--built-bg); border-color:currentColor}
.chip.idle{color:var(--ink3); background:var(--sunk); border-color:var(--rule)}
.status .say{color:var(--ink2); font-size:.86rem; flex:1; min-width:10rem}
.act{
  font:600 .78rem/1 var(--sans); color:#fff; background:var(--survey);
  border:0; border-radius:6px; padding:.55rem .95rem; cursor:pointer;
}
.act:hover{filter:brightness(1.08)}
.act:disabled{opacity:.5; cursor:default}

/* ---------- layout ---------- */
.cols{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:1.6rem; align-items:start}
@media (max-width:960px){ .cols{grid-template-columns:1fr} }

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  box-shadow:var(--shadow); margin-bottom:1.1rem; overflow:hidden;
}
.card > h2{
  margin:0; padding:.7rem 1rem; font:600 .7rem/1 var(--sans);
  text-transform:uppercase; letter-spacing:.11em; color:var(--ink3);
  border-bottom:1px solid var(--rule2); display:flex; justify-content:space-between;
  align-items:center; gap:.5rem; background:var(--sunk);
}
.card > h2 .count{font-family:var(--mono); letter-spacing:0; color:var(--ink3)}
.pad{padding:1rem}
.none{color:var(--ink3); font-size:.84rem; font-style:italic; padding:.9rem 1rem}

/* ---------- the spine: a surveyed route, not a list ---------- */
.rail{list-style:none; margin:0; padding:.6rem 1rem .9rem}
.stn{position:relative; padding:.5rem 0 .5rem 2.35rem; min-height:2.1rem}
.stn::before{ /* the route line */
  content:""; position:absolute; left:.72rem; top:0; bottom:0; width:1.5px;
  background:var(--rule);
}
.stn:first-child::before{top:1.1rem}
.stn:last-child::before{bottom:calc(100% - 1.1rem)}
.stn .pin{
  position:absolute; left:0; top:.62rem; width:1.45rem; height:1.45rem;
  border-radius:50%; border:1.5px solid var(--rule); background:var(--surface);
  font:600 .64rem/1 var(--mono); color:var(--ink3);
  display:flex; align-items:center; justify-content:center; z-index:1;
}
.stn.READY .pin{border-color:var(--survey); color:var(--survey); background:var(--survey-bg)}
.stn.BUILT .pin{border-color:var(--built); color:var(--built); background:var(--built-bg)}
.stn.gated .pin{border-color:var(--gate); color:var(--gate); background:var(--gate-bg)}
.stn .ttl{font-size:.85rem; line-height:1.4; color:var(--ink); word-break:break-word}
.stn .meta{font:400 .72rem/1.45 var(--mono); color:var(--ink3); margin-top:.15rem; word-break:break-all}
.stn.gated .ttl{color:var(--gate); font-weight:600}
.pill{
  display:inline-block; font:600 .62rem/1 var(--mono); letter-spacing:.04em;
  padding:.2rem .38rem; border-radius:4px; margin-left:.35rem; vertical-align:1px;
}
.pill.nospec{color:var(--ink3); background:var(--sunk); border:1px solid var(--rule)}
.pill.yours{color:var(--gate); background:var(--gate-bg); border:1px solid currentColor}

/* ---------- concepts ---------- */
.grp{padding:.75rem 1rem}
.grp + .grp{border-top:1px solid var(--rule2)}
.grp h3{
  margin:0 0 .5rem; font:600 .66rem/1 var(--sans); letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink3);
}
.tags{display:flex; flex-wrap:wrap; gap:.3rem}
.tag{
  font:500 .72rem/1 var(--mono); padding:.28rem .45rem; border-radius:5px;
  background:var(--sunk); color:var(--ink2); border:1px solid var(--rule2);
}
.tag.OWNED{background:var(--built-bg); color:var(--built); border-color:currentColor}

/* ---------- files ---------- */
.files{list-style:none; margin:0; padding:.5rem .55rem; max-height:17rem; overflow:auto}
.files li{
  display:flex; justify-content:space-between; gap:.5rem; align-items:center;
  padding:.3rem .45rem; border-radius:5px;
  font:400 .765rem/1.4 var(--mono); color:var(--ink2); word-break:break-all;
}
.files li:hover{background:var(--sunk)}
.files li.gated{color:var(--gate); font-weight:600; background:var(--gate-bg)}

/* ---------- transcript ---------- */
.turn{margin-bottom:.75rem}
.turn .who{
  font:600 .66rem/1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink3); margin-bottom:.35rem;
}
.turn .bubble{
  background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  padding:.85rem 1rem; box-shadow:var(--shadow); white-space:pre-wrap;
  word-wrap:break-word; font-size:.9rem; line-height:1.62;
}
.turn.learner .who{color:var(--survey)}
.turn.learner .bubble{background:var(--survey-bg); border-color:transparent}
.turn.receipt .bubble{
  background:var(--built-bg); border-color:transparent; color:var(--built);
  font:500 .78rem/1.5 var(--mono); box-shadow:none;
}
.turn.handoff .bubble{
  background:transparent; border-style:dashed; color:var(--ink2);
  font-size:.8rem; box-shadow:none;
}
.turn.error .bubble{background:var(--gate-bg); border-color:transparent; color:var(--gate); font-size:.85rem}

/* collapsed tool run — the wall of grep/read lines, folded */
.work{margin-bottom:.75rem; border:1px solid var(--rule2); border-radius:9px;
      background:var(--sunk); overflow:hidden}
.work summary{
  cursor:pointer; list-style:none; padding:.5rem .8rem;
  font:500 .76rem/1.4 var(--mono); color:var(--ink2);
  display:flex; align-items:center; gap:.5rem;
}
.work summary::-webkit-details-marker{display:none}
.work summary::before{content:"▸"; color:var(--ink3); font-size:.7rem; transition:transform .15s}
.work[open] summary::before{transform:rotate(90deg)}
.work summary:hover{color:var(--ink)}
.work ol{list-style:none; margin:0; padding:.15rem .8rem .65rem 1.9rem;
         border-top:1px solid var(--rule2)}
.work li{font:400 .74rem/1.65 var(--mono); color:var(--ink3); word-break:break-all}

/* ---------- blocked notice ---------- */
.blocked{
  border:1px solid var(--rule); border-left:3px solid var(--survey);
  background:var(--surface); border-radius:8px; padding:.9rem 1rem;
  box-shadow:var(--shadow); margin-bottom:1rem;
}
.blocked b{display:block; font-size:.84rem; margin-bottom:.25rem}
.blocked p{margin:0; font-size:.84rem; color:var(--ink2); line-height:1.6}

/* ---------- composer ---------- */
.composer{margin-top:1.4rem}
textarea{
  width:100%; min-height:5rem; resize:vertical; padding:.8rem .9rem;
  background:var(--surface); color:var(--ink); border:1px solid var(--rule);
  border-radius:9px; font:inherit; font-size:.9rem; box-shadow:var(--shadow);
}
textarea:focus{outline:none; border-color:var(--survey); box-shadow:0 0 0 3px var(--survey-bg)}
textarea:disabled{background:var(--sunk); color:var(--ink3); box-shadow:none}
.foot{display:flex; align-items:center; gap:.75rem; margin-top:.6rem; flex-wrap:wrap}
.hint{font:400 .72rem/1.5 var(--mono); color:var(--ink3)}
.err{color:var(--gate); font-size:.82rem; min-height:1.1em; margin-top:.5rem}

/* ---------- inspector ---------- */
.tabs{display:flex; gap:.3rem; margin-left:auto}
.tab{
  font:600 .74rem/1 var(--sans); color:var(--ink2); background:transparent;
  border:1px solid var(--rule); border-radius:6px; padding:.42rem .8rem; cursor:pointer;
}
.tab.on{background:var(--survey); color:#fff; border-color:var(--survey)}
.tab:hover:not(.on){background:var(--surface); color:var(--ink)}
.insp{max-width:60rem}
.trn{margin-bottom:1rem}
.trn > summary{
  cursor:pointer; list-style:none; display:flex; align-items:center; gap:.6rem;
  flex-wrap:wrap; padding:.75rem 1rem; background:var(--surface);
  border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow);
}
.trn[open] > summary{border-radius:10px 10px 0 0; border-bottom-color:transparent}
.trn > summary::-webkit-details-marker{display:none}
.trn > summary::before{content:"▸"; color:var(--ink3); transition:transform .15s}
.trn[open] > summary::before{transform:rotate(90deg)}
.trn .nm{font:700 .82rem/1 var(--mono); color:var(--survey)}
.trn .mdl{font:400 .74rem/1 var(--mono); color:var(--ink3)}
.trn .tally{font:400 .72rem/1 var(--mono); color:var(--ink3); margin-left:auto}
.body2{border:1px solid var(--rule); border-top:0; border-radius:0 0 10px 10px;
       background:var(--surface); padding:.25rem 1rem 1rem}
.sec{margin-top:1rem}
.sec > h4{
  margin:0 0 .4rem; font:600 .66rem/1 var(--sans); letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink3);
}
pre{
  margin:0; padding:.8rem .9rem; background:var(--sunk); border:1px solid var(--rule2);
  border-radius:8px; overflow:auto; max-height:26rem;
  font:400 .755rem/1.6 var(--mono); color:var(--ink2); white-space:pre-wrap;
  word-break:break-word;
}
pre.tall{max-height:none}
.expand{font:500 .7rem/1 var(--sans); color:var(--survey); background:none; border:0;
        cursor:pointer; padding:.35rem 0}
.note{font-size:.8rem; color:var(--ink2); line-height:1.6; margin:0 0 .5rem;
      padding:.6rem .75rem; background:var(--survey-bg); border-radius:7px}
.step{display:flex; gap:.6rem; padding:.4rem 0; border-top:1px solid var(--rule2)}
.step:first-child{border-top:0}
.step .t{font:400 .68rem/1.7 var(--mono); color:var(--ink3); flex-shrink:0; width:4.2rem}
.step .c{flex:1; min-width:0}
.step .k{font:700 .68rem/1.7 var(--mono); letter-spacing:.04em}
.step.tool .k{color:var(--survey)}
.step.result .k{color:var(--ink3)}
.step.receipt .k{color:var(--built)}
.step.text .k{color:var(--ink2)}
.step.error .k{color:var(--gate)}
.step .txt{font-size:.82rem; line-height:1.6; white-space:pre-wrap; word-break:break-word}
.chipline{font:400 .72rem/1 var(--mono); color:var(--ink3)}

/* ---------- adopt ---------- */
.adopt{max-width:33rem; margin:5rem auto}
.adopt h1{font:600 1.5rem/1.25 var(--sans); letter-spacing:-.025em; margin:0 0 .6rem}
.adopt .lede{color:var(--ink2); font-size:.92rem; margin:0 0 2rem; line-height:1.65}
label{display:block; font:600 .68rem/1 var(--sans); letter-spacing:.1em;
      text-transform:uppercase; color:var(--ink3); margin:0 0 .45rem}
input[type=text]{
  width:100%; padding:.7rem .85rem; background:var(--surface); color:var(--ink);
  border:1px solid var(--rule); border-radius:8px; font:inherit; font-size:.88rem;
  font-family:var(--mono);
}
input[type=text]:focus{outline:none; border-color:var(--survey); box-shadow:0 0 0 3px var(--survey-bg)}
.row{display:flex; gap:.6rem; margin-bottom:1.7rem}
.row input{flex:1}
.drop{
  padding:2.1rem 1rem; text-align:center; color:var(--ink3); background:var(--surface);
  border:1.5px dashed var(--rule); border-radius:9px; font-size:.85rem; cursor:pointer;
}
.drop:hover,.drop.over{border-color:var(--survey); color:var(--survey); background:var(--survey-bg)}
.sep{display:flex; align-items:center; gap:.8rem; margin:1.5rem 0;
     font:500 .68rem/1 var(--sans); letter-spacing:.12em; color:var(--ink3)}
.sep::before,.sep::after{content:""; flex:1; height:1px; background:var(--rule)}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null, T=null, busy=false, timer=null, openWork={}, openTurns={};
let view = localStorage.getItem('tutor-view') || 'session';

/* theme: system by default, explicit choice remembered */
const savedTheme = localStorage.getItem('tutor-theme');
if(savedTheme) document.documentElement.dataset.theme = savedTheme;
function flipTheme(){
  const cur = document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('tutor-theme', next);
  render();
}

async function api(p,o){
  const r = await fetch(p,o); const j = await r.json().catch(()=>({error:'bad response'}));
  if(!r.ok) throw new Error(j.error||'request failed'); return j;
}
async function load(){ S = await api('/api/state'); render(); }

/* ================= adopt ================= */
function renderAdopt(){
  app.innerHTML = `
  <div class="adopt">
    <h1>Which codebase are we building?</h1>
    <p class="lede">The tutor reads it once, cuts it into slices you can write in a
      sitting, and then teaches you to write them — one at a time, with the spec hidden.
      Nothing is hardcoded; point it anywhere.</p>
    <label for="path">Folder on this machine</label>
    <div class="row">
      <input type="text" id="path" placeholder="C:\\Users\\you\\projects\\thing" autocomplete="off">
      <button class="act" id="go">Adopt</button>
    </div>
    <div class="sep">OR</div>
    <label>Upload a zip</label>
    <div class="drop" id="drop">Drop a .zip here, or click to choose</div>
    <input type="file" id="file" accept=".zip" hidden>
    <div class="err" id="err"></div>
  </div>`;
  const err=document.getElementById('err'), fail=e=>err.textContent=e.message||String(e);
  go.onclick = async () => {
    const path = document.getElementById('path').value.trim();
    if(!path) return fail(new Error('Type a folder path first.'));
    err.textContent='Adopting…';
    try{ S=(await api('/api/adopt',{method:'POST',body:JSON.stringify({path})})).state; render(); }
    catch(e){ fail(e); }
  };
  document.getElementById('path').onkeydown = e => { if(e.key==='Enter') go.click(); };
  const send = async f => {
    if(!f) return; err.textContent=`Extracting ${f.name}…`;
    try{ S=(await api('/api/adopt-zip?name='+encodeURIComponent(f.name),{method:'POST',body:f})).state; render(); }
    catch(e){ fail(e); }
  };
  drop.onclick=()=>file.click();
  file.onchange=()=>send(file.files[0]);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');send(e.dataTransfer.files[0])};
}

/* ================= session ================= */
function render(){
  if(!S.adopted) return renderAdopt();
  const a = S.active;
  app.innerHTML = `
  <div class="top">
    <h1 class="mark">tutor</h1>
    <div class="target">${esc(S.root)}</div>
    <div class="tabs">
      <button class="tab ${view==='session'?'on':''}" data-v="session">Session</button>
      <button class="tab ${view==='inspect'?'on':''}" data-v="inspect">Inspector</button>
      <button class="ghost" id="theme">${isDark()?'Light':'Dark'} mode</button>
    </div>
  </div>

  <div class="status">
    <span class="chip ${esc(a.status)}"><span class="led"></span>${esc(a.label||'no codebase')}</span>
    <span class="say">${esc(a.activity)}</span>
    ${surveyButton(a)}
  </div>

  ${view==='inspect' ? `<div class="insp">${inspector()}</div>` : `
  <div class="cols">
    <main>
      ${a.blocked_by ? `<div class="blocked"><b>${esc(a.label)} can't run yet</b>
         <p>${esc(a.blocked_by)}</p></div>` : ''}
      ${transcript()}
      ${composer(a)}
    </main>
    <aside>
      ${gateCard()}
      ${spineCard()}
      ${runsCard()}
      ${conceptCard()}
      ${vocabCard()}
      ${card('Files', `<ul class="files">${S.files.map(f=>
        `<li class="${f.gated?'gated':''}"><span>${esc(f.path)}</span>${
          f.gated?'<span class="pill yours">yours</span>':''}</li>`).join('')}</ul>`,
        S.files.length)}
    </aside>
  </div>`}`;
  theme.onclick = flipTheme;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    view = b.dataset.v; localStorage.setItem('tutor-view', view);
    if(view==='inspect') loadTrace(); else render();
  });
  wireRun(); wireComposer(); wireInspector(); poll();
}

/* ================= inspector ================= */
async function loadTrace(){
  try{ T = (await api('/api/trace')).turns; }catch(e){ T = []; }
  render();
}

function inspector(){
  if(!T) return '<p class="none">Loading the record…</p>';
  if(!T.length) return `<div class="blocked"><b>No agent turns recorded yet</b>
    <p>Run the survey or plan a slice, then come back. Every turn is kept here in
    full: the exact instructions it was given, every tool call with its arguments,
    every result, and what it committed.</p></div>`;
  return T.map((t,i) => turnCard(t,i)).join('');
}

function turnCard(t, i){
  const open = openTurns[i] ? ' open' : (i===T.length-1 ? ' open' : '');
  const tally = Object.entries(t.counts||{}).map(([k,v])=>`${k}×${v}`).join('  ');
  return `<details class="trn" data-i="${i}"${open}>
    <summary>
      <span class="nm">${esc(t.agent)}</span>
      <span class="mdl">${esc(t.model)}</span>
      <span class="mdl">${esc(t.started_at)}${t.ended_at?'–'+esc(t.ended_at):' · running'}</span>
      <span class="tally">${esc(tally)}</span>
    </summary>
    <div class="body2">
      ${t.context_note ? `<div class="sec"><h4>Context this turn was given</h4>
        <p class="note">${esc(t.context_note)}</p></div>` : ''}
      <div class="sec"><h4>Tools allowed</h4>
        <p class="chipline">${esc((t.tools_allowed||[]).join(' · ')) || 'none'}</p></div>
      <div class="sec"><h4>System prompt — verbatim, as sent</h4>
        <pre>${esc(t.system_prompt)}</pre>
        <button class="expand" data-x>Expand / collapse</button></div>
      <div class="sec"><h4>First message</h4>
        <pre>${esc(t.first_message)}</pre>
        <button class="expand" data-x>Expand / collapse</button></div>
      <div class="sec"><h4>Timeline — ${(t.steps||[]).length} steps</h4>
        ${(t.steps||[]).map(stepRow).join('') || '<p class="none">nothing yet</p>'}</div>
      ${t.outcome ? `<div class="sec"><h4>Outcome</h4>
        <p class="note">${esc(t.outcome)}</p></div>` : ''}
    </div></details>`;
}

function stepRow(s){
  const label = s.kind==='tool' ? s.tool : s.kind;
  let body;
  if(s.kind==='tool')        body = `<pre>${esc(s.args)}</pre>`;
  else if(s.kind==='result') body = `<pre>${esc(s.output)}</pre>`;
  else                       body = `<div class="txt">${esc(s.text)}</div>`;
  return `<div class="step ${esc(s.kind)}">
    <span class="t">${esc(s.at)}</span>
    <div class="c"><span class="k">${esc(label)}</span>${body}</div></div>`;
}

function wireInspector(){
  document.querySelectorAll('.trn').forEach(d =>
    d.ontoggle = () => { openTurns[d.dataset.i] = d.open; });
  document.querySelectorAll('[data-x]').forEach(b =>
    b.onclick = () => b.previousElementSibling.classList.toggle('tall'));
}
const isDark = () => (document.documentElement.dataset.theme
  || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')) === 'dark';

const card = (title, inner, count) =>
  `<section class="card"><h2>${esc(title)}${count!==undefined
    ? `<span class="count">${count}</span>`:''}</h2>${inner}</section>`;

/* one button, two meanings — first survey, or archive-and-redraw */
function surveyButton(a){
  if(a.status==='running') return '';
  if(a.startable) return `<button class="act" id="run">${esc(a.start_label)}</button>`;
  if(a.resurveyable) return '<button class="ghost" id="run">Survey again</button>';
  return '';
}

function runsCard(){
  const r = S.runs || [];
  if(!r.length) return '';
  return card('Earlier surveys', `<ul class="files">${r.map(x=>
    `<li><span>${esc(x.when)} · ${esc(x.label)}</span>
       <span class="pill nospec">${x.slices}s / ${x.concepts}c</span></li>`).join('')}</ul>
    <p class="none" style="padding:.2rem 1rem .8rem">Archived under
      <span class="mono">.tutor/runs/</span> — plain SQLite files, open them with any client.</p>`,
    r.length);
}

function spineCard(){
  if(!S.spine.length) return card('The spine', '<p class="none">Not surveyed yet.</p>');
  const gated = S.gate ? S.gate.slice : null;
  return card('The spine', `<ol class="rail">${S.spine.map(s=>`
    <li class="stn ${esc(s.state)} ${s.slug===gated?'gated':''}">
      <span class="pin">${s.ordinal ?? '·'}</span>
      <div class="ttl">${esc(s.title)}</div>
      <div class="meta">${esc(s.target_file)}${
        s.has_spec?'':' <span class="pill nospec">no spec</span>'}${
        s.subhole?` · subhole: ${esc(s.subhole)}`:''}</div>
    </li>`).join('')}</ol>`, S.spine.length);
}

function conceptCard(){
  if(!S.concepts.length) return card('Concepts', '<p class="none">Not surveyed yet.</p>');
  const by = {OWNED:[], READY:[], LOCKED:[]};
  S.concepts.forEach(c => (by[c.state]||by.LOCKED).push(c));
  const grp = (k,label) => by[k].length ? `<div class="grp"><h3>${label} · ${by[k].length}</h3>
    <div class="tags">${by[k].map(c=>`<span class="tag ${k}">${esc(c.slug)}</span>`).join('')}</div></div>` : '';
  return card('Concepts', grp('OWNED','Owned')+grp('READY','Ready')+grp('LOCKED','Not yet'),
              S.concepts.length);
}

function gateCard(){
  if(!S.gate) return '';
  return card('Gate — open', `<div class="pad">
    <div class="ttl" style="font-weight:600;color:var(--gate)">${esc(S.gate.title)}</div>
    <p style="margin:.5rem 0 0;font-size:.85rem;color:var(--ink2);line-height:1.6">
      You write <span class="mono">${esc(S.gate.target_file)}</span> yourself. The spec is
      hidden and the tutor may not write into it.</p></div>`);
}

function vocabCard(){
  const v=S.vocab; if(!v.ok.length && !v.hold.length) return '';
  const g=(l,arr,cls)=>arr.length?`<div class="grp"><h3>${l} · ${arr.length}</h3>
    <div class="tags">${arr.map(t=>`<span class="tag ${cls}">${esc(t)}</span>`).join('')}</div></div>`:'';
  return card('Vocabulary', g('Ok to use',v.ok,'OWNED')+g('Held',v.hold,''));
}

/* transcript: fold consecutive tool calls into one expandable run */
function transcript(){
  if(!S.transcript.length){
    const a=S.active;
    // the blocked card above already explains this turn — don't also invite input
    if(a.blocked_by) return '';
    if(a.agent==='M/SURVEY') return `<div class="blocked"><b>No map yet</b>
      <p>M/SURVEY has to read this codebase once and cut it into slices before there is
      anything to teach. Nothing is running until you start it.</p></div>`;
    if(a.status!=='waiting') return '';
    return `<div class="blocked"><b>Waiting for you</b>
      <p>Say something to begin. The tutor asks before it explains.</p></div>`;
  }
  const out=[]; let run=null, i=0;
  const flush = () => {
    if(!run) return;
    const k='w'+run.i, open = openWork[k] ? ' open' : '';
    out.push(`<details class="work" data-k="${k}"${open}><summary>${run.items.length}
      ${run.items.length===1?'step':'steps'} — ${esc(summarise(run.items))}</summary>
      <ol>${run.items.map(t=>`<li>${esc(t.text)}</li>`).join('')}</ol></details>`);
    run=null;
  };
  for(const t of S.transcript){
    if(t.kind==='tool'){ (run ||= {i:i, items:[]}).items.push(t); i++; continue; }
    flush();
    const who = t.kind==='learner' ? 'you' : (t.agent||'L');
    out.push(`<div class="turn ${esc(t.kind)}"><div class="who">${esc(who)}</div>
      <div class="bubble">${esc(t.text)}</div></div>`);
    i++;
  }
  flush();
  return out.join('');
}
function summarise(items){
  const n={};
  items.forEach(t=>{ const k=t.text.trim().split(/\s+/)[0]; n[k]=(n[k]||0)+1; });
  return Object.entries(n).map(([k,v])=>v>1?`${k} ×${v}`:k).join(', ');
}

function composer(a){
  const open = a.status==='waiting';
  const ph = a.status==='running' ? `${a.label} is working…`
           : a.status==='due'     ? `${a.label} has not run yet`
           : 'Your answer…';
  return `<div class="composer">
    <textarea id="say" placeholder="${esc(ph)}"${open?'':' disabled'}></textarea>
    <div class="foot">
      <button class="act" id="send"${open?'':' disabled'}>Send</button>
      <span class="hint">model ${esc(S.model||'unpinned')} · runner ${esc(S.runner)}${
        S.runner==='scripted'?' (live loop not wired)':''} · ⌘/ctrl+enter</span>
    </div>
    <div class="err" id="err"></div></div>`;
}

function wireRun(){
  const b=document.getElementById('run'); if(!b) return;
  const redraw = S.active.resurveyable && !S.active.startable;
  const label = redraw ? 'Survey again' : S.active.start_label;
  const route = redraw ? '/api/survey' : (S.active.start_route || '/api/survey');
  b.onclick = async () => {
    if(redraw && !confirm(
        `Archive the current spine (${S.spine.length} slices, ${S.concepts.length} concepts) `
        + `and survey again?\n\nThe old map is saved to .tutor/runs/ so you can compare.`)) return;
    b.disabled=true; b.textContent='Starting…';
    try{ S=(await api(route,{method:'POST'})).state; render(); }
    catch(e){ b.disabled=false; b.textContent=label;
              document.getElementById('err').textContent=e.message; }
  };
}
function wireComposer(){
  const box=document.getElementById('say'), btn=document.getElementById('send');
  document.querySelectorAll('.work').forEach(d =>
    d.ontoggle = () => { openWork[d.dataset.k] = d.open; });
  if(!box || box.disabled) return;
  const send = async () => {
    const text=box.value.trim(); if(!text||busy) return;
    busy=true; btn.disabled=true; document.getElementById('err').textContent='';
    try{ S=(await api('/api/say',{method:'POST',body:JSON.stringify({text})})).state; render(); }
    catch(e){ document.getElementById('err').textContent=e.message; btn.disabled=false; }
    finally{ busy=false; }
  };
  btn.onclick=send;
  box.onkeydown = e => { if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) send(); };
  box.focus();
}
function poll(){
  clearTimeout(timer);
  if(S.active.status!=='running') return;
  timer=setTimeout(async()=>{
    try{
      S=await api('/api/state');
      if(view==='inspect') T=(await api('/api/trace')).turns;   // watch a turn build live
      render();
    }catch(e){ poll(); }
  },1200);
}
load().catch(e => app.innerHTML =
  `<div class="adopt"><div class="blocked"><b>Can't reach the tutor server</b>
   <p>${esc(e.message)}</p></div></div>`);
</script>
</body>
</html>
