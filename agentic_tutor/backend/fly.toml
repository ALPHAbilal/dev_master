# fly.toml app configuration file generated for backend-withered-morning-5909 on 2026-09-06T23:34:06+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-withered-morning-5909'
primary_region = 'fra'

[build]

[env]
  AUTH_MODE = 'dev'

[mounts]
  source = 'tutor_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
